name: Bounded alternate Agnes image versions (no publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/agnes-image-version-test-request.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: afp-usable-key-audit
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - name: Offline tests without credentials
        run: python -m unittest discover -s tests -p 'test_probe_agnes_image_versions.py' -v
      - name: Same-key same-input alternate version tests
        env:
          AGNES_API_BASE: https://apihub.agnes-ai.com/v1
          AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
          AGNES_HEALTHY_SLOTS_ONLY: '1'
          BLOG_IMAGE_QUEUE_ENABLED: '1'
          BLOG_IMAGE_QUEUE_TOKEN: ${{ github.token }}
        run: python automation/probe_agnes_image_versions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alternate-image-versions-${{ github.run_id }}
          path: data/agnes-image-version-tests/
          if-no-files-found: ignore
