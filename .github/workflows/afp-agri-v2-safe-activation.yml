name: AFP agri v2 - evidence-gated safe activation
on:
  push:
    branches: [feat/agri-generator-v2-2905-merge593]
    paths: [data/agri-v2/safe-activation-request.json, data/agri-v2/repair-start-request.json, data/agri-v2/curated-continuation-request.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: afp-agri-v2-live
  cancel-in-progress: false
jobs:
  cycle:
    if: github.repository == 'getsalet/nono'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BLOG_IMAGE_QUEUE_TOKEN: ${{ github.token }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
      AFP_WP_BASE_URL: ${{ secrets.AFP_WP_BASE_URL }}
      AFP_WP_USERNAME: ${{ secrets.AFP_WP_USERNAME }}
      AFP_WP_APP_PASSWORD: ${{ secrets.AFP_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agri-generator-v2-2905-merge593
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Offline safety and integrity tests
        run: python -m unittest discover -s tests/agri_v2 -v
      - name: Validate activation proof then one source-ready quality-gated cycle
        run: |
          python -c "from automation.agri_v2.safe_activation import authorized; assert authorized(), 'Explicit owner authorization and quality policy required'"
          if [ -f data/agri-v2/curated-continuation-request.json ]; then
            AFP_PROGRESS_ENABLED=1 python -m automation.agri_v2.curated_continuation
          elif [ -f data/agri-v2/repair-start-request.json ]; then
            AFP_PROGRESS_ENABLED=1 python -m automation.agri_v2.repair_start
          else
            AFP_PROGRESS_ENABLED=1 python -m automation.agri_v2.cycle --scheduled
          fi
      - name: Preserve receipts and partial progress
        if: always()
        run: bash .github/scripts/persist-agri-v2.sh
