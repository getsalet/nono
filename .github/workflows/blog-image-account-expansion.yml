name: One bounded distinct-account image expansion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/blog-image-account-expansion-request.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: afp-usable-key-audit
  cancel-in-progress: false
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - name: Offline regression checks before any provider call
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Probe at most six separate accounts and admit real image successes
        env:
          AGNES_API_BASE: https://apihub.agnes-ai.com/v1
          AGNES_HEALTHY_SLOTS_ONLY: '1'
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
          AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
          AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
          AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
          AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
          AGNES_KEY_ROTATE_EVERY: '1'
          AGNES_MODEL: agnes-2.5-flash
          AGNES_IMAGE_MODEL: agnes-image-2.5-flash
          BLOG_IMAGE_QUEUE_ENABLED: '1'
          BLOG_IMAGE_QUEUE_TOKEN: ${{ github.token }}
        run: python automation/blog_image_account_expansion.py
      - name: Preserve sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distinct-account-expansion-${{ github.run_id }}
          path: data/blog-image-account-expansion/
          if-no-files-found: ignore
