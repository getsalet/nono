name: Upload new city batches via FTPS

on:
  workflow_dispatch:
  # Commits created by another GitHub Actions workflow do not reliably trigger
  # a second push workflow. Poll twice per hour; the hash gate below exits
  # immediately when every package is already uploaded.
  schedule:
    - cron: "10,40 * * * *"
  # Fire only when the generate workflow commits a NEW 50-post batch (it writes
  # .new-batch-signal). This replaces the old workflow_run trigger that fired on
  # every single-post commit — the cause of 500+ no-op FTPS runs.
  push:
    branches: [main]
    paths:
      - ".github/workflows/upload-city-batches-ftps.yml"
      - "artifacts/city-content-queue/.new-batch-signal"

permissions:
  contents: write

env:
  FTP_HOST: ftp.navar-abyari.ir
  FTP_PORT: "21"
  FTP_USER: zzz@navar-abyari.ir
  FTP_REMOTE_DIR: /
  FTP_TLS_VERIFY: "false"
  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

concurrency:
  # Serialize uploads with city generation and image rebuilds so a ZIP cannot
  # change while it is being hashed or transferred.
  group: navar-city-content-queue
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip unless a new or changed batch exists
        id: detect
        # Fast gate: if every batch ZIP already matches the recorded upload state,
        # there is nothing new to push to FTPS, so bail out before the expensive
        # image-policy check + FTPS connect. This stops the workflow from running
        # 500x on every single post commit — it now only does real work when a
        # new 50-post batch is actually packaged.
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          STATE = Path("artifacts/city-content-queue/ftps-upload-state.json")
          PKGS  = Path("artifacts/city-content-queue/packages")
          state = json.loads(STATE.read_text(encoding="utf-8")) if STATE.exists() else {"files": {}}
          tracked = state.get("files", {})
          changed = []
          for z in sorted(PKGS.glob("*.zip")) if PKGS.exists() else []:
              digest = hashlib.sha256(z.read_bytes()).hexdigest()
              prev = tracked.get(z.name, {})
              if prev.get("sha256") != digest:
                  changed.append(z.name)
          if not changed:
              print("No new or changed batches since last FTPS upload; skipping this run.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("has_changes=false\n")
              raise SystemExit(0)
          print(f"New/changed batches to upload: {changed}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("has_changes=true\n")
          PY
      - name: Verify compressed image policy
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path("artifacts/city-content-queue/image-compression-report.json")
          if not report.exists():
              raise SystemExit("image compression report is missing")
          data = json.loads(report.read_text(encoding="utf-8"))
          if data.get("quality") != 60 or data.get("mode") != "apply":
              raise SystemExit("images are not confirmed as WebP quality 60")
          image_dir = Path("artifacts/city-content-queue/images")
          bad = [p.name for p in image_dir.iterdir() if p.is_file() and p.suffix.lower() in {".jpg", ".jpeg", ".png"}]
          if bad:
              raise SystemExit(f"uncompressed image files remain: {bad[:5]}")
          print(f"verified {data.get('image_count', 0)} compressed images at WebP quality 60")
          PY

      - name: Verify FTPS secret exists
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: test -n "$FTP_PASSWORD"

      - name: Upload only new or changed batches
        if: steps.detect.outputs.has_changes == 'true'
        run: python automation/upload_new_city_batches_ftps.py

      - name: Commit upload state when changed
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/city-content-queue/ftps-upload-state.json
          if git diff --cached --quiet; then
            echo "No new or changed batches were uploaded."
            exit 0
          fi
          git commit -m "Record automatic FTPS batch uploads"
          git pull --rebase --autostash origin main
          git push origin main
