# Dispatch-only FTPS upload: runs only for a newly created 50-post package.
name: Upload new city batches via FTPS

on:
  # This workflow is dispatched by the generator only when a new 50-post ZIP
  # changes .new-batch-signal. No schedule means no empty hourly runner.
  workflow_dispatch:

permissions:
  contents: write

env:
  FTP_HOST: ftp.navar-abyari.ir
  FTP_PORT: "21"
  FTP_USER: zzz@navar-abyari.ir
  FTP_REMOTE_DIR: /
  FTP_TLS_VERIFY: "false"
  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

concurrency:
  # Serialize uploads with city generation and image rebuilds so a ZIP cannot
  # change while it is being hashed or transferred.
  group: navar-city-content-queue
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect newly signaled package
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json
          from pathlib import Path

          root = Path("artifacts/city-content-queue")
          signal = root / ".new-batch-signal"
          state_path = root / "ftps-upload-state.json"
          tracked = {}
          if state_path.exists():
              try:
                  tracked = json.loads(state_path.read_text(encoding="utf-8")).get("files", {})
              except Exception:
                  tracked = {}
          pending = []
          if signal.exists():
              for raw in signal.read_text(encoding="utf-8").splitlines():
                  name = Path(raw.strip()).name
                  if not name:
                      continue
                  if not name.endswith(".zip"):
                      name += ".zip"
                  path = root / "packages" / name
                  if not path.exists():
                      raise SystemExit(f"signaled package is missing: {name}")
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  previous = tracked.get(name, {})
                  if previous.get("sha256") != digest or int(previous.get("size", -1)) != path.stat().st_size:
                      pending.append(name)
          print("has_changes=" + ("true" if pending else "false"))
          print("pending_names=" + ",".join(pending))
          PY
      - name: Verify compressed image policy
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path("artifacts/city-content-queue/image-compression-report.json")
          if not report.exists():
              raise SystemExit("image compression report is missing")
          data = json.loads(report.read_text(encoding="utf-8"))
          if data.get("quality") != 60 or data.get("mode") != "apply":
              raise SystemExit("images are not confirmed as WebP quality 60")
          image_dir = Path("artifacts/city-content-queue/images")
          bad = [p.name for p in image_dir.iterdir() if p.is_file() and p.suffix.lower() in {".jpg", ".jpeg", ".png"}]
          if bad:
              raise SystemExit(f"uncompressed image files remain: {bad[:5]}")
          print(f"verified {data.get('image_count', 0)} compressed images at WebP quality 60")
          PY

      - name: Verify FTPS secret exists
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: test -n "$FTP_PASSWORD"

      - name: Upload only new or changed batches
        if: steps.detect.outputs.has_changes == 'true'
        run: python automation/upload_new_city_batches_ftps.py

      - name: Commit upload state when changed
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/city-content-queue/ftps-upload-state.json
          if git diff --cached --quiet; then
            echo "No new or changed batches were uploaded."
            exit 0
          fi
          state_dir="$(mktemp -d)"
          cp artifacts/city-content-queue/ftps-upload-state.json "$state_dir/ftps-upload-state.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$state_dir/ftps-upload-state.json" artifacts/city-content-queue/ftps-upload-state.json
          git add -f artifacts/city-content-queue/ftps-upload-state.json
          git commit -m "Record automatic FTPS batch uploads"
          git push origin main
