name: Verify image backpressure and checkpoint integrity (offline only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [automation/blog_image_backpressure.py, tests/test_blog_image_backpressure.py, .github/workflows/blog-backpressure-check.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
