name: One named tape live canary through normal pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/blog-tape-live-canary-request.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: blog-tape-live-canary
  cancel-in-progress: false
jobs:
  activate-one:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IMAGE_KEY_POOL_ENABLED: '1'
      IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'agnes-image-2.5-flash' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - name: Offline guards before dispatching any real pipeline
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Dispatch at most one existing tape draft with all production gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/run_blog_tape_canary.py
