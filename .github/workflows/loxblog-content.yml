name: LoxBlog independent content pipeline
on:
  workflow_dispatch:
    inputs:
      diagnose_login: {description: 'Read-only native login diagnosis (1=yes)', default: '1'}
permissions:
  contents: read
concurrency:
  group: loxblog-content-pipeline
  cancel-in-progress: false
jobs:
  native-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      AGNES_MODEL: agnes-2.5-flash
      LOXBLOG_USERNAME: ${{ secrets.LOXBLOG_USERNAME }}
      LOXBLOG_PASSWORD: ${{ secrets.LOXBLOG_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automation
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: bash automation/install_blog_browser.sh chromium
      - run: python -m pip install --quiet Pillow
      - name: Validate dedicated secrets without exposing values
        run: |
          test -n "$LOXBLOG_USERNAME" && test -n "$LOXBLOG_PASSWORD" || { echo 'Missing dedicated LoxBlog secrets'; exit 1; }
      - name: Read-only native LoxBlog diagnosis
        run: python automation/loxblog_native.py
