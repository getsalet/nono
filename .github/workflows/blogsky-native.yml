name: Blogsky native connection (manual single-post)

on:
  push:
    branches: [main]
    paths: [.github/workflows/blogsky-native.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose: login/editor/archive only; publish-one: one approved existing draft'
        type: choice
        options: [diagnose, publish-one]
        default: diagnose
      target:
        description: 'Exact city key; required only for publish-one'
        type: string
        default: ''

permissions:
  contents: write
concurrency:
  group: blogsky-native-publication
  cancel-in-progress: false
jobs:
  native:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[blogsky-native-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stop gate before dependencies and credentials
        id: gate
        run: python automation/check_blog_pipeline_control.py blogsky
      - name: Install browser dependencies
        if: steps.gate.outputs.proceed == '1'
        run: |
          python -m pip install Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Native publisher regression tests
        if: steps.gate.outputs.proceed == '1'
        run: python -m unittest discover -s tests -p 'test_blogsky_native.py' -v
      - name: Reconcile the already-public first-post receipt (no network or publication)
        if: github.event_name == 'push' && steps.gate.outputs.proceed == '1'
        run: |
          python automation/reconcile_blogsky_receipt.py city-373f12c4d2b81e25
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/blogsky/backlink-queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'Reconcile verified first Blogsky public post in queue [skip ci]'
            git push
          fi
      - name: Native connection or one explicitly selected post
        if: steps.gate.outputs.proceed == '1'
        env:
          BLOGSKY_USERNAME: ${{ secrets.BLOGSKY_USERNAME }}
          BLOGSKY_PASSWORD: ${{ secrets.BLOGSKY_PASSWORD }}
          BLOGSKY_NATIVE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'diagnose' }}
          BLOGSKY_TARGET: ${{ inputs.target }}
        run: python automation/publish_blogsky_posts.py
      - name: Preserve submission journal even when verification fails
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-one' && steps.gate.outputs.proceed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: blogsky-native-checkpoints
          path: |
            artifacts/blogsky-backlink-queue/
            artifacts/content-originality/blogsky/
            data/blogsky/backlink-queue.json
            state/blogsky-backlink-progress.json
      - name: Commit verified state or unconfirmed write-ahead journal
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-one' && steps.gate.outputs.proceed == '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/blogsky-backlink-queue artifacts/content-originality/blogsky data/blogsky/backlink-queue.json state/blogsky-backlink-progress.json
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint Blogsky native publication result [skip ci]'
            git push
          fi
