name: Blogsky stalled submission read-only diagnostic
# Expanded native form validation inspection; no submit.
on:
  push:
    branches: [main]
    paths: [.github/workflows/blogsky-stalled-diagnostic.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: blogsky-native-publication
  cancel-in-progress: false
jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native archive reader
        run: |
          python -m pip install --quiet Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Inspect known failure and native archive without posting or changing controls
        env:
          GH_TOKEN: ${{ github.token }}
          BLOGSKY_USERNAME: ${{ secrets.BLOGSKY_USERNAME }}
          BLOGSKY_PASSWORD: ${{ secrets.BLOGSKY_PASSWORD }}
        run: python automation/diagnose_blogsky_stalled.py
      - name: Preserve diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogsky-stalled-read-only-${{ github.run_id }}
          path: artifacts/blogsky-backlink-queue/diagnostics/stalled-native.json
          if-no-files-found: warn
