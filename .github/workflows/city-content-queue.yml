          git add -f artifacts/city-content-queue/.new-batch-signal 2>/dev/null || true
          git add -A artifacts/city-content-queue

          # Batch archives are upload-ready ZIPs that MUST be committed so the
          # separate FTPS workflow can read them from git. The repo .gitignore
          # ignores *.zip, so add the batch packages explicitly. The per-post
          # source SQL/rollback and aggregate publish files are also ignored by
          # *.sql, so force-add them so future checkouts carry the payload that
          # feeds each package (otherwise packages build with empty SQL).
          git add -f artifacts/city-content-queue/packages/batch-*.zip
          git add -f artifacts/city-content-queue/sql/*.sql
          git add -f artifacts/city-content-queue/rollback/*.sql
          git add -f artifacts/city-content-queue/create-all-completed.sql
          git add -f artifacts/city-content-queue/rollback-all-completed.sql
          git add -f artifacts/city-content-queue/.new-batch-signal 2>/dev/null || true
          git add -A artifacts/city-content-queue

          if git diff --cached --quiet; then
            if [ "$QUEUE_CODE" -ne 0 ]; then
              echo "Queue generation failed with exit code $QUEUE_CODE" >&2
              exit "$QUEUE_CODE"
            fi
            exit 0
          fi

          git commit -m "Process next city content queue item"
          git reset --hard HEAD
          git pull --rebase --autostash origin main
          git push origin main

          if [ "$QUEUE_CODE" -ne 0 ]; then
            echo "Queue generation failed with exit code $QUEUE_CODE" >&2
            exit "$QUEUE_CODE"
          fi
          exit 0
