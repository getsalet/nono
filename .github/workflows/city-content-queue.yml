if truly_new:
    signal_path.write_text("
".join(truly_new) + "
", encoding="utf-8")
    print(f"New batch(es) ready: {truly_new} — wrote .new-batch-signal")
else:
    signal_path.unlink(missing_ok=True)
    print("No new batch this run; .new-batch-signal cleared")
