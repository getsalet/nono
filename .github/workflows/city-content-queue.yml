name: Generate missing city posts and images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/city-content-queue.yml'
      - 'automation/city_content_queue_cloudflare.py'
      - 'automation/reviewed_publish_city_queue.py'
      - 'automation/run_agnes_city_queue.py'
      - 'automation/run_agnes_city_queue_seo.py'
      - 'automation/image_prompt_policy.py'
      - 'automation/text_cleanup_policy.py'
      - 'automation/repair_completed_city_sql.py'
      - 'automation/assets/**'

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: navar-city-content-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: "1"
      GIT_TERMINAL_PROMPT: "0"

      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.AGNES_API_KEY }}
      IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}

      AGNES_MODEL: agnes-3.0-flash
      AGNES_IMAGE_MODEL: agnes-image-2.5-flash
      IMAGE_MODEL: agnes-image-2.5-flash

      BATCH_SIZE: "4"
      ARTICLE_WORKERS: "4"
      IMAGE_WORKERS: "8"
      WORDPRESS_DB_NAME: navaraby_wp569
      CURRENT_IMAGE_POLICY: reference-rerender-3d-v5-approved-scales-topic-first

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare diagnostics
        shell: bash
        run: |
          set -e

          mkdir -p artifacts/city-content-queue
          : > artifacts/city-content-queue/run.log

          echo "event=${{ github.event_name }}" | tee -a artifacts/city-content-queue/run.log
          echo "policy=$CURRENT_IMAGE_POLICY" | tee -a artifacts/city-content-queue/run.log
          echo "batch_size=$BATCH_SIZE article_workers=$ARTICLE_WORKERS image_workers=$IMAGE_WORKERS" | tee -a artifacts/city-content-queue/run.log
          echo "ftp_upload=separate_workflow_after_success" | tee -a artifacts/city-content-queue/run.log
          echo "actions_artifacts=preserved" | tee -a artifacts/city-content-queue/run.log

          test -n "${AGNES_API_KEY:-}" || {
            echo "ERROR: AGNES_API_KEY missing" | tee -a artifacts/city-content-queue/run.log
            exit 1
          }

          python -m py_compile \
            automation/city_content_queue.py \
            automation/city_content_queue_cloudflare.py \
            automation/run_agnes_city_queue_fast.py \
            automation/run_agnes_city_queue_resilient.py \
            automation/run_agnes_city_queue_seo.py \
            automation/reviewed_publish_city_queue.py \
            automation/content_layout_policy.py \
            automation/image_prompt_policy.py \
            automation/image_quality_gate.py \
            automation/research_grounding_review.py \
            automation/faq_policy.py \
            automation/text_cleanup_policy.py \
            automation/repair_completed_city_sql.py \
            automation/import_permalink_fix.py \
            automation/package_city_content_batches.py \
            automation/render_city_queue_status.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install image tooling
        run: |
          python -m pip install --disable-pip-version-check pillow

      - name: Apply one-time WebP quality 60 migration
        shell: bash
        run: |
          set -euo pipefail
          REPORT=artifacts/city-content-queue/image-compression-report.json
          if [ -f "$REPORT" ] && grep -q '"quality": 60' "$REPORT"; then
            echo "Existing image compression report confirms WebP quality 60; migration already complete."
            exit 0
          fi
          python automation/compress_city_images.py \
            --apply \
            --quality 60 \
            --compare-quality 78 \
            --report "$REPORT"
          python automation/package_city_content_batches.py
          python automation/render_city_queue_status.py

      - name: Run next queue item
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/city-content-queue

          python automation/run_agnes_city_queue_fast.py \
            2>&1 | tee -a artifacts/city-content-queue/run.log
          QUEUE_CODE=${PIPESTATUS[0]}
          echo "queue_exit_code=$QUEUE_CODE" | tee -a artifacts/city-content-queue/run.log

          AUX_CODE=0
          python automation/repair_completed_city_sql.py || AUX_CODE=$?
          python automation/import_permalink_fix.py || AUX_CODE=$?
          python automation/package_city_content_batches.py || AUX_CODE=$?
          python automation/render_city_queue_status.py || AUX_CODE=$?
          if [ "$AUX_CODE" -eq 0 ]; then
            python automation/write_new_batch_signal.py || AUX_CODE=$?
          fi
          echo "auxiliary_exit_code=$AUX_CODE" | tee -a artifacts/city-content-queue/run.log

          # Force-add generated SQL and ZIP payloads that are broadly ignored.
          git add -f artifacts/city-content-queue/.new-batch-signal 2>/dev/null || true
          git add -f artifacts/city-content-queue/packages/batch-*.zip 2>/dev/null || true
          git add -f artifacts/city-content-queue/sql/*.sql 2>/dev/null || true
          git add -f artifacts/city-content-queue/rollback/*.sql 2>/dev/null || true
          git add -f artifacts/city-content-queue/create-all-completed.sql 2>/dev/null || true
          git add -f artifacts/city-content-queue/rollback-all-completed.sql 2>/dev/null || true
          git add -A artifacts/city-content-queue

          if ! git diff --cached --quiet; then
            git commit -m "Process next city content queue item"
            git reset --hard HEAD
            git pull --rebase --autostash origin main
            git push origin main
          fi

          if [ "$QUEUE_CODE" -ne 0 ]; then
            echo "Queue generation failed with exit code $QUEUE_CODE" >&2
            exit "$QUEUE_CODE"
          fi
          if [ "$AUX_CODE" -ne 0 ]; then
            echo "Packaging/status generation failed with exit code $AUX_CODE" >&2
            exit "$AUX_CODE"
          fi
