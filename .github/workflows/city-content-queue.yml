name: Generate missing city posts and images

on:
  workflow_dispatch:

  schedule:
    - cron: "*/7 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: navar-city-content-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: "1"
      GIT_TERMINAL_PROMPT: "0"

      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}

      AGNES_MODEL: agnes-3.0-flash
      AGNES_IMAGE_MODEL: agnes-image-2.0-flash
      IMAGE_MODEL: agnes-image-2.0-flash

      BATCH_SIZE: "1"
      CURRENT_IMAGE_POLICY: reference-conditioned-full-scene-v19

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free GitHub Actions artifact quota
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "navar-artifact-cleanup",
          }

          def call(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          deleted = 0
          failed = 0
          bytes_deleted = 0
          while True:
              status, body = call(f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100")
              if status != 200:
                  print(f"list artifacts failed: {status} {body.decode('utf-8', 'replace')}")
                  raise SystemExit(0)
              artifacts = json.loads(body).get("artifacts") or []
              if not artifacts:
                  break
              for artifact in artifacts:
                  artifact_id = artifact["id"]
                  del_status, del_body = call(
                      f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}",
                      method="DELETE",
                  )
                  if del_status in (204, 200):
                      deleted += 1
                      bytes_deleted += int(artifact.get("size_in_bytes") or 0)
                      print(f"deleted {artifact.get('name')} id={artifact_id} size={artifact.get('size_in_bytes')}")
                  else:
                      failed += 1
                      print(f"failed {artifact.get('name')} id={artifact_id} status={del_status}")
          print(f"artifact_cleanup deleted={deleted} failed={failed} bytes_deleted={bytes_deleted}")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare diagnostics
        shell: bash
        run: |
          set -e

          mkdir -p artifacts/city-content-queue
          : > artifacts/city-content-queue/run.log

          echo "event=${{ github.event_name }}" | tee -a artifacts/city-content-queue/run.log
          echo "policy=$CURRENT_IMAGE_POLICY" | tee -a artifacts/city-content-queue/run.log
          echo "batch_size=$BATCH_SIZE" | tee -a artifacts/city-content-queue/run.log
          echo "ftp_upload=separate_workflow_after_success" | tee -a artifacts/city-content-queue/run.log
          echo "actions_artifacts=disabled" | tee -a artifacts/city-content-queue/run.log

          test -n "${AGNES_API_KEY:-}" || {
            echo "ERROR: AGNES_API_KEY missing" | tee -a artifacts/city-content-queue/run.log
            exit 1
          }

          python -m py_compile \
            automation/run_agnes_city_queue_fast.py \
            automation/import_permalink_fix.py \
            automation/package_city_content_batches.py \
            automation/render_city_queue_status.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install image tooling
        run: |
          python -m pip install --disable-pip-version-check pillow

      - name: Apply one-time WebP quality 60 migration
        shell: bash
        run: |
          set -euo pipefail
          REPORT=artifacts/city-content-queue/image-compression-report.json
          if [ -f "$REPORT" ] && grep -q '"quality": 60' "$REPORT"; then
            echo "Existing image compression report confirms WebP quality 60; migration already complete."
            exit 0
          fi
          python automation/compress_city_images.py \
            --apply \
            --quality 60 \
            --compare-quality 78 \
            --report "$REPORT"
          python automation/package_city_content_batches.py
          python automation/render_city_queue_status.py

      - name: Run next queue item
        shell: bash
        run: |
          set +e

          mkdir -p artifacts/city-content-queue

          python automation/run_agnes_city_queue_fast.py \
            2>&1 | tee -a artifacts/city-content-queue/run.log

          QUEUE_CODE=${PIPESTATUS[0]}
          echo "queue_exit_code=$QUEUE_CODE" \
            | tee -a artifacts/city-content-queue/run.log

          python automation/import_permalink_fix.py || true
          python automation/package_city_content_batches.py || true
          python automation/render_city_queue_status.py || true

          # Batch archives are upload-ready ZIPs that MUST be committed so the
          # separate FTPS workflow can read them from git. The repo .gitignore
          # ignores *.zip, so add the batch packages explicitly. The per-post
          # source SQL/rollback and aggregate publish files are also ignored by
          # *.sql, so force-add them so future checkouts carry the payload that
          # feeds each package (otherwise packages build with empty SQL).
          # Signal file: written only when a NEW 50-post batch was packaged in
          # this run. The FTPS upload workflow triggers on push of this file,
          # so it fires exactly when a new batch is ready (not on every post).
          # Signal file: written only when a NEW 50-post batch was packaged in
          # this run. The FTPS upload workflow triggers on push of this file,
          # so it fires exactly when a new batch is ready (not on every post).
          python - <<'SIGNAL_PY'
import json, pathlib, sys
manifest_path = pathlib.Path("artifacts/city-content-queue/packages/manifest.json")
state_path    = pathlib.Path("artifacts/city-content-queue/ftps-upload-state.json")
signal_path   = pathlib.Path("artifacts/city-content-queue/.new-batch-signal")
