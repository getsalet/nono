# Throughput mode: repair saturated pending rows, process 24 cities, and keep strict QA on key image roles.
name: Generate missing city posts and images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/city_content_queue_cloudflare.py'
      - 'automation/reviewed_publish_city_queue.py'
      - 'automation/run_agnes_city_queue.py'
      - 'automation/run_agnes_city_queue_fast.py'
      - 'automation/run_agnes_city_queue_resilient.py'
      - 'automation/run_agnes_city_queue_seo.py'
      - 'automation/text_cleanup_policy.py'
      - 'automation/repair_completed_city_sql.py'


permissions:
  contents: write
  actions: write

concurrency:
  group: navar-city-content-pipeline
  cancel-in-progress: false

jobs:
  rebuild_gate:
    runs-on: ubuntu-latest
    outputs:
      allow_production: ${{ steps.check.outputs.allow_production }}
    steps:
      - name: Checkout rebuild state
        uses: actions/checkout@v7
      - name: Pause normal generation until posts 567-632 are repaired
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f artifacts/city-content-queue/QUEUE_PAUSED ]; then
            echo "allow_production=false" >> "$GITHUB_OUTPUT"
            echo "Normal city generation is temporarily paused by QUEUE_PAUSED."
            exit 0
          fi
          remaining="$(python - <<'PY2'
          import json
          from pathlib import Path
          path=Path('artifacts/city-content-queue/recent-image-rebuild-v4.json')
          print(int(json.loads(path.read_text(encoding='utf-8')).get('remaining_candidates',0)) if path.exists() else 1)
          PY2
          )"
          if [ "$remaining" -gt 0 ]; then
            echo "allow_production=false" >> "$GITHUB_OUTPUT"
            echo "Normal city generation is paused; strict restoration still has $remaining posts remaining."
            active="$(gh run list --workflow rebuild-reference-images.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length')"
            if [ "$active" -eq 0 ]; then
              echo "No repair run is active; dispatching the strict image rebuild."
              gh workflow run rebuild-reference-images.yml --ref main
            fi
          else
            echo "allow_production=true" >> "$GITHUB_OUTPUT"
            echo "Strict restoration is complete; normal city generation is released."
          fi

  generate:
    needs: rebuild_gate
    if: needs.rebuild_gate.outputs.allow_production == 'true' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[image-rebuild]'))
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: "1"
      GIT_TERMINAL_PROMPT: "0"

      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY15 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY16 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY17 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY18 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY19 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY20 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY21 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY22 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY23 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY24 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY25 }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.AGNES_API_KEY14 }}
      IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}

      AGNES_MODEL: agnes-3.0-flash
      AGNES_IMAGE_MODEL: agnes-image-2.5-flash
      IMAGE_MODEL: agnes-image-2.5-flash

      # Controlled full-power ramp for the shared eight-key pool: each repository receives
      # half of the tested combined budget while both queues are active.
      # Adaptive stable share after live telemetry: five strict images per city create
      # more API calls than the three-image article pipeline.
      BATCH_SIZE: "24"
      ARTICLE_WORKERS: "24"
      IMAGE_WORKERS: "56"
      IMAGE_QA_ATTEMPTS: "5"
      IMAGE_QA_MIN_SCORE: "70"
      IMAGE_QA_REVIEW_ATTEMPTS: "3"
      IMAGE_SET_QA_ATTEMPTS: "3"
      IMAGE_QA_FAST_MODE: "0"
      # Role 2 still participates in the set-diversity review; skip only its
      # redundant per-image vision call to avoid repeated oversized-product loops.
      IMAGE_QA_REVIEW_KINDS: "1,2,3"
      # At most one quarantined repair may consume a three-article batch.
      # Keep production capacity on fresh cities. Quarantined repairs are
      # handled separately after fresh throughput is healthy.
      REPAIR_FAILED_LIMIT: "4"
      # One bounded full retry wave for the terminal failures. Each row is
      # marked before processing, so a second failure cannot loop forever.
      FAILED_RETRY_WAVE_POLICY: "city-failed-retry-wave-v18-20260930"
      FAILED_RETRY_WAVE_LIMIT: "24"
      WORDPRESS_DB_NAME: navaraby_wp569
      CURRENT_IMAGE_POLICY: approved-single-pass-integrated-v23-positive-scenes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare diagnostics
        shell: bash
        run: |
          set -e

          mkdir -p artifacts/city-content-queue
          : > artifacts/city-content-queue/run.log

          echo "event=${{ github.event_name }}" | tee -a artifacts/city-content-queue/run.log
          echo "policy=$CURRENT_IMAGE_POLICY" | tee -a artifacts/city-content-queue/run.log
          echo "batch_size=$BATCH_SIZE article_workers=$ARTICLE_WORKERS image_workers=$IMAGE_WORKERS" | tee -a artifacts/city-content-queue/run.log
          echo "ftp_upload=separate_workflow_after_success" | tee -a artifacts/city-content-queue/run.log
          echo "actions_artifacts=preserved" | tee -a artifacts/city-content-queue/run.log

          test -n "${AGNES_API_KEY:-}" || {
            echo "ERROR: AGNES_API_KEY missing" | tee -a artifacts/city-content-queue/run.log
            exit 1
          }

          python -m py_compile \
            automation/city_content_queue.py \
            automation/city_content_queue_cloudflare.py \
            automation/run_agnes_city_queue_fast.py \
            automation/run_agnes_city_queue_resilient.py \
            automation/run_agnes_city_queue_seo.py \
            automation/reviewed_publish_city_queue.py \
            automation/content_layout_policy.py \
            automation/image_prompt_policy.py \
            automation/image_quality_gate.py \
            automation/research_grounding_review.py \
            automation/faq_policy.py \
            automation/text_cleanup_policy.py \
            automation/repair_completed_city_sql.py \
            automation/import_permalink_fix.py \
            automation/package_city_content_batches.py \
            automation/render_city_queue_status.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install image tooling
        run: |
          python -m pip install --disable-pip-version-check pillow

      - name: Apply one-time WebP quality 60 migration
        shell: bash
        run: |
          set -euo pipefail
          REPORT=artifacts/city-content-queue/image-compression-report.json
          if [ -f "$REPORT" ] && grep -q '"quality": 60' "$REPORT"; then
            echo "Existing image compression report confirms WebP quality 60; migration already complete."
            exit 0
          fi
          python automation/compress_city_images.py \
            --apply \
            --quality 60 \
            --compare-quality 78 \
            --report "$REPORT"
          python automation/package_city_content_batches.py
          python automation/render_city_queue_status.py

      - name: Run next queue item
        id: queue
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/city-content-queue

          python automation/run_agnes_city_queue_fast.py \
            2>&1 | tee -a artifacts/city-content-queue/run.log
          QUEUE_CODE=${PIPESTATUS[0]}
          echo "queue_exit_code=$QUEUE_CODE" | tee -a artifacts/city-content-queue/run.log
          echo "exit_code=$QUEUE_CODE" >> "$GITHUB_OUTPUT"

          AUX_CODE=0
          python automation/repair_completed_city_sql.py || AUX_CODE=$?
          python automation/import_permalink_fix.py || AUX_CODE=$?
          python automation/package_city_content_batches.py || AUX_CODE=$?
          python automation/render_city_queue_status.py || AUX_CODE=$?
          if [ "$AUX_CODE" -eq 0 ]; then
            python automation/write_new_batch_signal.py || AUX_CODE=$?
            ready="$(python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('artifacts/city-content-queue');signal=root/'.new-batch-signal';packages=root/'packages';state=root/'ftps-upload-state.json'
          try: tracked=json.loads(state.read_text(encoding='utf-8')).get('files',{})
          except Exception: tracked={}
          pending=0
          if signal.exists():
            for raw in signal.read_text(encoding='utf-8').splitlines():
              name=Path(raw.strip()).name
              if not name: continue
              if not name.endswith('.zip'): name+='.zip'
              path=packages/name
              if not path.exists(): continue
              digest=hashlib.sha256(path.read_bytes()).hexdigest();previous=tracked.get(name,{})
              if previous.get('sha256')!=digest or int(previous.get('size',-1))!=path.stat().st_size: pending+=1
          print(1 if pending else 0)
          PY
          )"
            echo "NEW_BATCH_READY=$ready" >> "$GITHUB_ENV"
            echo "city_ftps_dispatch_ready=$ready" | tee -a artifacts/city-content-queue/run.log
          fi
          echo "auxiliary_exit_code=$AUX_CODE" | tee -a artifacts/city-content-queue/run.log

          # Force-add generated SQL and ZIP payloads that are broadly ignored.
          git add -f artifacts/city-content-queue/.new-batch-signal 2>/dev/null || true
          git add -f artifacts/city-content-queue/packages/batch-*.zip 2>/dev/null || true
          git add -f artifacts/city-content-queue/sql/*.sql 2>/dev/null || true
          git add -f artifacts/city-content-queue/rollback/*.sql 2>/dev/null || true
          git add -f artifacts/city-content-queue/create-all-completed.sql 2>/dev/null || true
          git add -f artifacts/city-content-queue/rollback-all-completed.sql 2>/dev/null || true
          git add -f artifacts/city-content-queue/run.log 2>/dev/null || true
          git add -A artifacts/city-content-queue

          if ! git diff --cached --quiet; then
            state_dir="$(mktemp -d)"
            git diff --cached --name-only -z --diff-filter=ACMRT > "$state_dir/files"
            git diff --cached --name-only -z --diff-filter=D > "$state_dir/deleted"
            if [ -s "$state_dir/files" ]; then
              tar --null -T "$state_dir/files" -cf "$state_dir/payload.tar"
            fi

            git fetch origin main
            git reset --hard origin/main
            if [ -f "$state_dir/payload.tar" ]; then tar -xf "$state_dir/payload.tar"; fi
            if [ -s "$state_dir/deleted" ]; then xargs -0 -r rm -f -- < "$state_dir/deleted"; fi

            git add -f artifacts/city-content-queue/.new-batch-signal 2>/dev/null || true
            git add -f artifacts/city-content-queue/packages/batch-*.zip 2>/dev/null || true
            git add -f artifacts/city-content-queue/sql/*.sql 2>/dev/null || true
            git add -f artifacts/city-content-queue/rollback/*.sql 2>/dev/null || true
            git add -f artifacts/city-content-queue/create-all-completed.sql 2>/dev/null || true
            git add -f artifacts/city-content-queue/rollback-all-completed.sql 2>/dev/null || true
            git add -f artifacts/city-content-queue/run.log 2>/dev/null || true
            git add -A artifacts/city-content-queue
            git commit -m "Process next city content queue item"
            git push origin main
          fi

          if [ "$QUEUE_CODE" -ne 0 ]; then
            echo "Queue generation failed with exit code $QUEUE_CODE" >&2
            exit "$QUEUE_CODE"
          fi
          if [ "$AUX_CODE" -ne 0 ]; then
            echo "Packaging/status generation failed with exit code $AUX_CODE" >&2
            exit "$AUX_CODE"
          fi

      - name: Dispatch FTPS only for a newly created 50-post package
        if: always() && !cancelled() && env.NEW_BATCH_READY == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run upload-city-batches-ftps.yml --ref main

      # A batch can preserve valid partial progress while returning non-zero for
      # one quarantined article. Keep the queue moving in that case; hard bans
      # remain enforced by the generator and failures stay visible in STATUS.md.
      - name: Continue queue automatically
        if: always() && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r pending retry_wave_remaining <<<"$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          root=Path('artifacts/city-content-queue')
          status_path=root/'status.json';queue_path=root/'queue.json'
          status=json.loads(status_path.read_text(encoding='utf-8')) if status_path.exists() else {}
          state=json.loads(queue_path.read_text(encoding='utf-8')) if queue_path.exists() else {'items':[]}
          policy=os.environ.get('FAILED_RETRY_WAVE_POLICY','')
          remaining=sum(1 for item in state.get('items',[]) if item.get('status')=='failed' and item.get('failed_retry_wave_policy')!=policy)
          print(int(status.get('pending',0)),remaining)
          PY
          )"
          rebuild_remaining="$(python - <<'PY'
          import json
          from pathlib import Path
          path=Path('artifacts/city-content-queue/recent-image-rebuild-v4.json')
          print(int(json.loads(path.read_text(encoding='utf-8')).get('remaining_candidates',0)) if path.exists() else 1)
          PY
          )"
          rebuild_active="$(gh run list --workflow rebuild-reference-images.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length')"
          if [ "$rebuild_active" -gt 0 ]; then
            echo "City image rebuild is active or queued; it owns the next handoff."
          elif [ "$pending" -gt 0 ] && [ "$rebuild_remaining" -gt 0 ]; then
            echo "Fresh city production advanced; dispatching one bounded image-repair slice before the next content batch."
            gh workflow run rebuild-reference-images.yml --ref main
          elif [ "$pending" -gt 0 ] || [ "$retry_wave_remaining" -gt 0 ]; then
            cooldown=10
            if [ "${{ steps.queue.outputs.exit_code }}" != "0" ]; then cooldown=60; fi
            echo "Queue has $pending pending items and $retry_wave_remaining terminal failures not yet covered by the bounded retry wave; cooldown=${cooldown}s before the next controlled batch."
            sleep "$cooldown"
            gh workflow run city-content-queue.yml --ref main
          else
            echo "No pending city items remain; automatic chaining is complete."
          fi
