name: Verify full hose reference parity (one candidate, no publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [automation/verify_hose_full_references.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: blog-hose-fullrefs-check
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - name: Offline regressions without provider credentials or routing environment
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  hose-reference-check:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      BLOG_IMAGE_DIAGNOSTIC_FAMILY: hose
      BLOG_IMAGE_QUEUE_ENABLED: '1'
      BLOG_IMAGE_QUEUE_TOKEN: ${{ github.token }}
      IMAGE_KEY_POOL_ENABLED: '1'
      IMAGE_API_KEY: ${{ secrets.AGNES_API_KEY10 }}
      IMAGE_KEY_SLOT: AGNES_API_KEY10
      IMAGE_ENDPOINT: https://apihub.agnes-ai.com/v1/images/generations
      IMAGE_MODEL: agnes-image-2.5-flash
      AGNES_IMAGE_TRANSIENT_FAILOVER: '0'
      AGNES_KEY_ROTATE_EVERY: '1'
      AGNES_MODEL: agnes-2.5-flash
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            automation
            tests
            data
            templates
            .github/workflows
            artifacts/loxblog-backlink-queue/items
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - name: Generate exactly one diagnostic candidate, without publishing
        run: python automation/verify_hose_full_references.py
