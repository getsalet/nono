name: Test authoritative city product references
on:
  push:
    branches: [main]
    paths: ['automation/city-authoritative-product-test-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: city-authoritative-product-test
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY14 }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.AGNES_API_KEY14 }}
      IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
      AGNES_IMAGE_MODEL: agnes-image-2.5-flash
      TEST_FAMILY: both
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python -m py_compile automation/test_authoritative_product_images.py
      - name: Generate isolated product-reference samples
        run: python automation/test_authoritative_product_images.py
      - name: Commit samples only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/city-content-queue/test-images/authoritative-*
          git commit -m 'Add integrated authoritative product tests [skip ci]'
          git pull --rebase origin main
          git push origin main
