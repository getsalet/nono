name: Verify one generated image per blog article (no post publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [automation/blog_generated_image.py, automation/verify_generated_blog_images.py]

permissions:
  contents: write
concurrency:
  group: blog-generated-image-acceptance
  cancel-in-progress: false
jobs:
  image-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_IMAGE_REQUIRE_CAPABILITY_AUDIT: '1'
      AGNES_HEALTHY_SLOTS_ONLY: '1'
      AGNES_PREFERRED_KEY_SLOTS: 'AGNES_API_KEY14,AGNES_API_KEY15'
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
      AGNES_API_KEY16: ${{ secrets.AGNES_API_KEY16 }}
      AGNES_API_KEY17: ${{ secrets.AGNES_API_KEY17 }}
      AGNES_API_KEY18: ${{ secrets.AGNES_API_KEY18 }}
      AGNES_API_KEY19: ${{ secrets.AGNES_API_KEY19 }}
      AGNES_API_KEY20: ${{ secrets.AGNES_API_KEY20 }}
      AGNES_API_KEY21: ${{ secrets.AGNES_API_KEY21 }}
      AGNES_API_KEY22: ${{ secrets.AGNES_API_KEY22 }}
      AGNES_API_KEY23: ${{ secrets.AGNES_API_KEY23 }}
      AGNES_API_KEY24: ${{ secrets.AGNES_API_KEY24 }}
      AGNES_API_KEY25: ${{ secrets.AGNES_API_KEY25 }}
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      AGNES_KEY_ROTATE_EVERY: '1'
      AGNES_MODEL: agnes-2.5-flash
      AGNES_IMAGE_MODEL: agnes-image-2.5-flash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /automation/
            /tests/
            /data/
            /artifacts/loxblog-backlink-queue/items/
            /artifacts/blog-image-reviews/
            /artifacts/blog-image-acceptance/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - run: python -m unittest discover -s tests -p 'test_blog_generated_image.py' -v
      - run: python -m unittest discover -s tests -p 'test_agnes_key_pool.py' -v
      - run: python -m unittest discover -s tests -p 'test_blog_image_rollout_pipeline.py' -v
      - uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/loxblog-backlink-queue/generated-images
            artifacts/blog-image-reviews
          key: blog-generated-image-v1-${{ github.run_id }}
          restore-keys: blog-generated-image-v1-
      - name: Generate and visually validate both genuine product families
        run: python automation/verify_generated_blog_images.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            artifacts/loxblog-backlink-queue/generated-images
            artifacts/blog-image-reviews
          key: blog-generated-image-v1-${{ github.run_id }}
      - name: Preserve non-secret image candidates for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-generated-image-candidates-${{ github.run_id }}
          path: |
            artifacts/loxblog-backlink-queue/generated-images/*.webp
            data/blog-generated-image-acceptance.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Persist acceptance without credentials, native sessions or API bodies
        if: always()
        run: python automation/checkpoint_blog_image_diagnostics.py
