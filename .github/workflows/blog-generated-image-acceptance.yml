name: Verify one generated image per blog article (no post publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [automation/verify_generated_blog_images.py, .github/workflows/blog-generated-image-acceptance.yml]
permissions:
  contents: write
concurrency:
  group: blog-generated-image-acceptance
  cancel-in-progress: false
jobs:
  image-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      AGNES_MODEL: agnes-2.5-flash
      AGNES_IMAGE_MODEL: agnes-image-2.5-flash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /automation/
            /tests/
            /data/
            /artifacts/blog-image-reviews/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - run: python -m unittest discover -s tests -p 'test_blog_generated_image.py' -v
      - name: Generate and visually validate both genuine product families
        run: python automation/verify_generated_blog_images.py
      - name: Persist acceptance without credentials, native sessions or API bodies
        if: always()
        run: |
          if [ ! -f data/blog-generated-image-acceptance.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/blog-generated-image-acceptance.json
          if [ -d artifacts/blog-image-reviews ]; then git add -f artifacts/blog-image-reviews; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record generated blog image acceptance without post publication'
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
