name: Parsiblog evidence-bound city generator
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Native probe, generate, draft, or verified public canary
        type: choice
        options: [probe, draft, generate, publish]
        default: draft
      target:
        description: Optional approved pb-key
        default: ''
  push:
    branches: [main]
    paths: [automation/start-parsiblog.json]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: parsiblog-city-native
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REQUESTED_MODE: ${{ inputs.mode || '' }}
      REQUESTED_TARGET: ${{ inputs.target || '' }}
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_MODEL: agnes-2.5-flash
      IMAGE_REVIEW_MODEL: agnes-3.0-flash
      AGNES_HEALTHY_SLOTS_ONLY: '1'
      AGNES_PREFERRED_KEY_SLOTS: AGNES_API_KEY14,AGNES_API_KEY15
      PARSIBLOG_USERNAME: ${{ secrets.PARSIBLOG_USERNAME }}
      PARSIBLOG_PASSWORD: ${{ secrets.PARSIBLOG_PASSWORD }}
      IMAGE_API_KEY: ${{ secrets.AGNES_API_KEY10 || secrets.AGNES_API_KEY }}
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
      AGNES_API_KEY16: ${{ secrets.AGNES_API_KEY16 }}
      AGNES_API_KEY17: ${{ secrets.AGNES_API_KEY17 }}
      AGNES_API_KEY18: ${{ secrets.AGNES_API_KEY18 }}
      AGNES_API_KEY19: ${{ secrets.AGNES_API_KEY19 }}
      AGNES_API_KEY20: ${{ secrets.AGNES_API_KEY20 }}
      AGNES_API_KEY21: ${{ secrets.AGNES_API_KEY21 }}
      AGNES_API_KEY22: ${{ secrets.AGNES_API_KEY22 }}
      AGNES_API_KEY23: ${{ secrets.AGNES_API_KEY23 }}
      AGNES_API_KEY24: ${{ secrets.AGNES_API_KEY24 }}
      AGNES_API_KEY25: ${{ secrets.AGNES_API_KEY25 }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Respect existing global stop and disabled schedule
        id: gate
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          global_control=json.loads(Path('data/blog-generated-image-control.json').read_text())
          local=json.loads(Path('data/parsiblog/control.json').read_text())
          mode='scheduled' if os.environ['GITHUB_EVENT_NAME']=='schedule' else os.environ.get('REQUESTED_MODE') or json.loads(Path('automation/start-parsiblog.json').read_text())['mode']
          if mode not in ('probe','draft','generate','publish','scheduled'):raise SystemExit('Invalid requested mode')
          proceed=global_control.get('pause_image_production') is False and (mode!='scheduled' or local.get('enabled') is True)
          with open(os.environ['GITHUB_OUTPUT'],'a')as out:out.write('proceed='+('1'if proceed else'0')+'\nmode='+mode+'\n')
          print('Parsiblog preflight:',mode,'allowed'if proceed else'blocked')
          PY
      - name: Install content test dependencies
        if: steps.gate.outputs.proceed == '1'
        run: python -m pip install --quiet Pillow beautifulsoup4
      - name: Test thousand-title inventory and native three-link contract
        if: steps.gate.outputs.proceed == '1'
        run: python -m unittest discover -s tests -p 'test_parsiblog_pipeline.py' -v
      - name: Install native browser
        if: steps.gate.outputs.proceed == '1'
        run: bash automation/install_blog_browser.sh
      - name: Run independent generator and native verification
        if: steps.gate.outputs.proceed == '1'
        env:
          RUN_MODE: ${{ steps.gate.outputs.mode }}
        run: python automation/parsiblog_pipeline.py --mode "$RUN_MODE" --target "$REQUESTED_TARGET"
      - name: Preserve non-secret recovery checkpoints
        if: always() && steps.gate.outputs.proceed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: parsiblog-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            state/parsiblog-progress.json
            data/parsiblog/control.json
            artifacts/parsiblog-backlink-queue
            artifacts/content-originality
            artifacts/blog-image-reviews
      - name: Commit only Parsiblog and content QA checkpoints
        if: always() && steps.gate.outputs.proceed == '1'
        run: |
          git switch -C parsiblog-checkpoint
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in state/parsiblog-progress.json data/parsiblog/control.json artifacts/parsiblog-backlink-queue artifacts/content-originality artifacts/blog-image-reviews; do
            if [ -e "$path" ]; then git add -f "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Parsiblog native verification and city generator checkpoints'
          if ! git diff --quiet; then echo '::error::Unexpected tracked changes; artifact retained.'; git diff --name-only; exit 1; fi
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Report actual readiness, not assumed success
        if: always() && steps.gate.outputs.proceed == '1'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('artifacts/parsiblog-backlink-queue/latest-receipt.json')
          probe=Path('artifacts/parsiblog-backlink-queue/login-probe.json')
          report=json.loads(p.read_text()) if p.exists() else json.loads(probe.read_text()) if probe.exists() else {'status':'No verified receipt; inspect failed step.'}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a')as out:out.write('## Actual Parsiblog receipt\n\n```json\n'+json.dumps(report,ensure_ascii=False,indent=2)+'\n```\n')
          PY
