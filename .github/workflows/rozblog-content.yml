name: RozBlog independent city content pipeline
on:
  workflow_dispatch:
    inputs:
      count: {description: 'New articles (0 = publish existing ready queue)', default: '3'}
      publish: {description: '1 = publish, 0 = generate/export only', default: '1'}
      dry_run: {description: '1 = configuration tests only, no publishable samples', default: '0'}
      target: {description: 'Optional topic key', default: ''}
      diagnose_login: {description: '1 = read-only native login diagnostic; no generation or publication', default: '0'}
  workflow_run:
    workflows: ['Independent AFP article image stock (no publication)']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '5,20,35,50 * * * *'
  push:
    branches: [main]
    paths: [automation/blog_public_content_verify.py, data/blog-editorial-image-policy.json, automation/blog_editorial_image_policy.py, tests/test_blog_editorial_image_policy.py, automation/check_blog_ready_image_handoff.py, tests/test_blog_ready_image_handoff.py, automation/check_blog_run_budget.py, tests/test_blog_budget_preflight_pipeline.py, tests/test_blog_generation_recovery.py, automation/farsiblog_backlink_queue.py, tests/test_blog_retry_pipeline.py, automation/rozblog_backlink_queue.py, automation/publish_rozblog_posts.py, automation/content_originality.py, tests/test_city_blog_pipeline.py, automation/city_backlink_policy.py, automation/blog_image_gate.py, data/blog-city-title-matrix.json, .github/workflows/rozblog-content.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: rozblog-content-pipeline
  cancel-in-progress: false
jobs:
  image_handoff:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.ready.outputs.proceed }}
      cached_only: ${{ steps.ready.outputs.cached_only }}
      target: ${{ steps.ready.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: ready
        run: python automation/check_blog_ready_image_handoff.py rozblog
  tests:
    needs: image_handoff
    if: needs.image_handoff.outputs.proceed == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  pipeline:
    needs: [tests, image_handoff]
    # Hosted native publication verified end-to-end; repository opt-in still gates scheduled runs.
    if: needs.image_handoff.outputs.proceed == '1' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ROZBLOG_AUTOMATION_ENABLED == '1') || (needs.image_handoff.outputs.cached_only == '1' && vars.ROZBLOG_AUTOMATION_ENABLED == '1'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      IMAGE_API_KEY: ${{ secrets.AGNES_API_KEY10 }}
      IMAGE_KEY_SLOT: AGNES_API_KEY10
      IMAGE_KEY_POOL_ENABLED: '1'
      IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'agnes-image-2.5-flash' }}
      AGNES_IMAGE_TRANSIENT_FAILOVER: '0'
      IMAGE_REVIEW_MODEL: ${{ vars.AGNES_MODEL || 'agnes-3.0-flash' }}
      AGNES_HEALTHY_SLOTS_ONLY: '1'
      AGNES_PREFERRED_KEY_SLOTS: 'AGNES_API_KEY14,AGNES_API_KEY15'
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
      AGNES_API_KEY16: ${{ secrets.AGNES_API_KEY16 }}
      AGNES_API_KEY17: ${{ secrets.AGNES_API_KEY17 }}
      AGNES_API_KEY18: ${{ secrets.AGNES_API_KEY18 }}
      AGNES_API_KEY19: ${{ secrets.AGNES_API_KEY19 }}
      AGNES_API_KEY20: ${{ secrets.AGNES_API_KEY20 }}
      AGNES_API_KEY21: ${{ secrets.AGNES_API_KEY21 }}
      AGNES_API_KEY22: ${{ secrets.AGNES_API_KEY22 }}
      AGNES_API_KEY23: ${{ secrets.AGNES_API_KEY23 }}
      AGNES_API_KEY24: ${{ secrets.AGNES_API_KEY24 }}
      AGNES_API_KEY25: ${{ secrets.AGNES_API_KEY25 }}
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      AGNES_KEY_ROTATE_EVERY: '1'
      AGNES_MODEL: agnes-2.5-flash
      ROZBLOG_USERNAME: ${{ secrets.ROZBLOG_USERNAME }}
      ROZBLOG_PASSWORD: ${{ secrets.ROZBLOG_PASSWORD }}
      BLOG_READY_IMAGE_HANDOFF: ${{ needs.image_handoff.outputs.cached_only }}
      ROZBLOG_COUNT: ${{ needs.image_handoff.outputs.cached_only == '1' && '1' || github.event.inputs.count || '3' }}
      ROZBLOG_PUBLISH: ${{ github.event.inputs.publish || '1' }}
      ROZBLOG_PUBLISH_LIMIT: '3'
      ROZBLOG_DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
      ROZBLOG_TARGET: ${{ needs.image_handoff.outputs.target || github.event.inputs.target || '' }}
      ROZBLOG_LOGIN_DIAGNOSTIC: ${{ github.event.inputs.diagnose_login || '0' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Respect user stop before costly or mutable work
        id: control
        run: python automation/check_blog_pipeline_control.py rozblog
      - name: Check rolling publication budget before costly steps
        if: steps.control.outputs.proceed == '1'
        id: budget
        run: python automation/check_blog_run_budget.py rozblog
      - name: Validate unattended credentials
        if: steps.control.outputs.proceed == '1' && (steps.budget.outputs.proceed == '1' && env.ROZBLOG_PUBLISH == '1' && env.ROZBLOG_DRY_RUN != '1')
        run: |
          if [ -z "$ROZBLOG_USERNAME" ] || [ -z "$ROZBLOG_PASSWORD" ]; then
            echo '::error::Set ROZBLOG_USERNAME and ROZBLOG_PASSWORD repository secrets.'
            exit 1
          fi
      - run: python -m pip install --quiet Pillow
        if: steps.control.outputs.proceed == '1' && (steps.budget.outputs.proceed == '1')
      - name: Generate independent city article with approved image
        if: steps.control.outputs.proceed == '1' && (steps.budget.outputs.proceed == '1' && env.ROZBLOG_LOGIN_DIAGNOSTIC != '1')
        env:
          BLOG_IMAGE_QUEUE_ENABLED: '1'
          BLOG_IMAGE_QUEUE_TOKEN: ${{ github.token }}
        run: python automation/rozblog_backlink_queue.py
      - name: Install Playwright
        if: steps.control.outputs.proceed == '1' && (steps.budget.outputs.proceed == '1' && env.ROZBLOG_PUBLISH == '1' && env.ROZBLOG_DRY_RUN != '1')
        run: |
          bash automation/install_blog_browser.sh
      - name: Publish and verify native RozBlog post
        if: steps.control.outputs.proceed == '1' && (steps.budget.outputs.proceed == '1' && env.ROZBLOG_DRY_RUN != '1')
        run: python automation/publish_rozblog_posts.py
      - name: Preserve rozblog recovery checkpoints
        if: steps.control.outputs.proceed == '1' && (always() && steps.budget.outputs.proceed == '1' && env.ROZBLOG_DRY_RUN != '1' && env.ROZBLOG_LOGIN_DIAGNOSTIC != '1')
        uses: actions/upload-artifact@v4
        with:
          name: rozblog-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/rozblog/backlink-queue.json
            state/rozblog-backlink-progress.json
            artifacts/rozblog-backlink-queue
            artifacts/content-originality
            artifacts/blog-image-reviews
      - name: Commit generation and per-post checkpoints
        if: steps.control.outputs.proceed == '1' && (always() && steps.budget.outputs.proceed == '1' && env.ROZBLOG_DRY_RUN != '1' && env.ROZBLOG_LOGIN_DIAGNOSTIC != '1')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/rozblog/backlink-queue.json
          for path in state/rozblog-backlink-progress.json artifacts/rozblog-backlink-queue artifacts/content-originality artifacts/blog-image-reviews; do
            if [ -e "$path" ]; then git add -f "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record original RozBlog content and verified publication'
          # Print paths only, never contents or secrets, if an unknown write appears.
          if ! git diff --quiet; then
            git diff --name-only
            echo '::error::Unexpected unstaged tracked changes; recovery artifact retained.'
            exit 1
          fi
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo '::error::Checkpoint push failed after three attempts; recovery artifact retained.'
          exit 1

      - name: Report actual publication target, including text-only articles
        if: steps.control.outputs.proceed == '1' && (always())
        run: python automation/blog_publication_throughput.py
      - name: Preserve actual throughput observation
        if: steps.control.outputs.proceed == '1' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: backlink-throughput-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/blog-throughput
          retention-days: 14
          if-no-files-found: ignore
