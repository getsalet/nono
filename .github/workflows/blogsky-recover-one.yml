name: Blogsky explicitly authorized single absent-intent recovery
on:
  push:
    branches: [main]
    paths: [.github/workflows/blogsky-recover-one.yml]
permissions:
  contents: write
concurrency:
  group: blogsky-native-publication
  cancel-in-progress: false
jobs:
  recover-exact-intent:
    if: contains(github.event.head_commit.message, '[blogsky-recover-one]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate gates before credentials
        run: python -c 'import sys;sys.path.insert(0,"automation");from publish_blogsky_posts import gate;gate()'
      - name: Install native browser
        run: |
          python -m pip install --quiet Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Recovery and native regression tests
        run: |
          python -m unittest discover -s tests -p 'test_blogsky_native.py'
          python -m unittest discover -s tests -p 'test_blogsky_auto.py'
          python -m unittest discover -s tests -p 'test_blogsky_recovery.py'
      - name: Fresh two-archive absence check and at most one native submission
        env:
          BLOGSKY_USERNAME: ${{ secrets.BLOGSKY_USERNAME }}
          BLOGSKY_PASSWORD: ${{ secrets.BLOGSKY_PASSWORD }}
          BLOGSKY_NATIVE_MODE: recover-one
          BLOGSKY_TARGET: city-66afad426708678b
        run: python automation/publish_blogsky_posts.py
      - name: Preserve outcome even if verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogsky-exact-recovery-${{ github.run_id }}
          path: |
            artifacts/blogsky-backlink-queue/
            artifacts/content-originality/blogsky/
            data/blogsky/backlink-queue.json
            state/blogsky-backlink-progress.json
      - name: Persist outcome and consume one-time recovery control
        if: always()
        run: python automation/checkpoint_blogsky_native.py --consume-recovery
