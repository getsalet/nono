name: Blogsky first city draft acceptance (no publication)
on:
  push:
    branches: [main]
    paths: [.github/workflows/blogsky-first-draft.yml]
permissions:
  contents: write
jobs:
  first-draft:
    # User-requested controlled restart: one Asadabad county draft; no schedule or publication.
    if: contains(github.event.head_commit.message, '[blogsky-first-draft]')
    uses: ./.github/workflows/blogsky-content.yml
    with:
      dry_run: false
      count: '1'
      target: city-373f12c4d2b81e25
    secrets: inherit
