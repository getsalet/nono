name: Blogsky first city draft acceptance (no publication)
on:
  push:
    branches: [main]
    paths: [.github/workflows/blogsky-first-draft.yml]
permissions:
  contents: write
jobs:
  first-draft:
    # A narrowly authorized one-shot push, not a schedule or general push producer.
    if: contains(github.event.head_commit.message, '[blogsky-first-draft]')
    uses: ./.github/workflows/blogsky-content.yml
    with:
      dry_run: false
      count: '1'
      target: city-44532954dbc9730f
    secrets: inherit
