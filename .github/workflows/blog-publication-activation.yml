name: Activate approved blog publication scope
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/blog-generated-image-control.json]
permissions:
  contents: read
  actions: write
concurrency:
  group: blog-publication-activation
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'agnes-image-2.5-flash' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - name: Verify code and scoped acceptance before starting publishers
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Start one controlled article per enabled blog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/activate_blog_publication.py
