name: Upload merged 865-post city images archive via FTPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-merged-city-images-ftps.yml'

permissions:
  contents: write

concurrency:
  group: upload-merged-city-images-ftps
  cancel-in-progress: false

env:
  FTP_HOST: ftp.navar-abyari.ir
  FTP_PORT: '21'
  FTP_USER: zzz@navar-abyari.ir
  FTP_REMOTE_DIR: /
  FTP_TLS_VERIFY: 'false'
  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
  ARCHIVE_NAME: nono-865-city-post-images.zip

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build merged archive from SQL-referenced images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          import os, re
          root = Path('artifacts/city-content-queue')
          sql = (root / 'create-all-completed.sql').read_text(encoding='utf-8')
          names = re.findall(r"'_wp_attached_file','2026/09/navar-city-generated/([^']+)'", sql)
          if len(names) != 3347 or len(set(names)) != 3347:
              raise SystemExit(f'Expected 3347 unique SQL image references, found {len(names)} refs / {len(set(names))} unique')
          missing = [name for name in names if not (root / 'images' / name).is_file()]
          if missing:
              raise SystemExit(f'Missing {len(missing)} referenced images; first: {missing[:5]}')
          output = Path('/tmp') / os.environ['ARCHIVE_NAME']
          with ZipFile(output, 'w', compression=ZIP_STORED, allowZip64=True) as archive:
              for name in names:
                  image = root / 'images' / name
                  archive.write(image, f'wp-content/uploads/2026/09/navar-city-generated/{name}')
          print(f'Created {output} with {len(names)} images ({output.stat().st_size} bytes)')
          PY
      - name: Upload and verify archive via explicit FTPS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          python - <<'PY'
          from pathlib import Path
          import os
          from automation.upload_city_batches_ftps import connect
          path = Path('/tmp') / os.environ['ARCHIVE_NAME']
          temporary = f'.{path.name}.uploading'
          ftp = connect()
          try:
              with path.open('rb') as stream:
                  ftp.storbinary(f'STOR {temporary}', stream, blocksize=1024 * 1024)
              remote_size = ftp.size(temporary)
              if remote_size != path.stat().st_size:
                  try: ftp.delete(temporary)
                  finally: raise RuntimeError(f'Size verification failed: local={path.stat().st_size}, remote={remote_size}')
              try: ftp.delete(path.name)
              except Exception: pass
              ftp.rename(temporary, path.name)
              final_size = ftp.size(path.name)
              if final_size != path.stat().st_size:
                  raise RuntimeError(f'Final size verification failed: local={path.stat().st_size}, remote={final_size}')
              print(f'Uploaded and verified: {path.name} ({final_size} bytes)')
          finally:
              try: ftp.quit()
              except Exception: ftp.close()
          PY
      - name: Record verified upload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          archive = Path('/tmp') / os.environ['ARCHIVE_NAME']
          marker = Path('artifacts/city-content-queue/merged-images-ftps-upload.json')
          marker.write_text(json.dumps({
              'archive': archive.name,
              'post_count': 865,
              'image_count': 3347,
              'size': archive.stat().st_size,
              'verified': True,
              'uploaded_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/city-content-queue/merged-images-ftps-upload.json
          git commit -m 'Record verified merged city image FTPS upload [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
