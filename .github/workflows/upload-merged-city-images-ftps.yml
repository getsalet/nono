# Retry requested for updated 888-post archive
name: Upload merged 888-post city images archive via FTPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-merged-city-images-ftps.yml'

permissions:
  contents: write

concurrency:
  group: upload-merged-city-images-ftps
  cancel-in-progress: false

env:
  FTP_HOST: ftp.navar-abyari.ir
  FTP_PORT: '21'
  FTP_USER: zzz@navar-abyari.ir
  FTP_REMOTE_DIR: /
  FTP_TLS_VERIFY: 'false'
  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
  ARCHIVE_NAME: nono-888-city-post-images.zip

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build merged archive from all packages and loose images
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          import json, os, re
          root = Path('artifacts/city-content-queue')
          sql = (root / 'create-all-completed.sql').read_text(encoding='utf-8')
          post_count = sql.count('START TRANSACTION;')
          if post_count != 888:
              raise SystemExit(f'Expected 888 post transactions, found {post_count}')
          refs = re.findall(r"'_wp_attached_file','2026/09/navar-city-generated/([^']+)'", sql)
          if len(refs) != len(set(refs)):
              raise SystemExit(f'Expected unique SQL image references, found {len(refs)} refs / {len(set(refs))} unique')
          sources = {}
          loose = root / 'images'
          if loose.exists():
              for path in loose.iterdir():
                  if path.is_file(): sources[path.name] = ('file', path, None)
          for package in sorted((root / 'packages').glob('*.zip')):
              with ZipFile(package) as batch:
                  for member in batch.namelist():
                      if member.endswith('/') or not member.lower().endswith('.webp'): continue
                      sources.setdefault(Path(member).name, ('zip', package, member))
          missing = [name for name in refs if name not in sources]
          if missing: raise SystemExit(f'Missing {len(missing)} referenced images; first: {missing[:10]}')
          output = Path('/tmp') / os.environ['ARCHIVE_NAME']
          with ZipFile(output, 'w', compression=ZIP_STORED, allowZip64=True) as archive:
              for name in refs:
                  kind, source, member = sources[name]
                  target = f'wp-content/uploads/2026/09/navar-city-generated/{name}'
                  if kind == 'file': archive.write(source, target)
                  else:
                      with ZipFile(source) as batch: archive.writestr(target, batch.read(member))
          meta = {'post_count': post_count, 'image_count': len(refs), 'size': output.stat().st_size}
          Path('/tmp/archive-meta.json').write_text(json.dumps(meta), encoding='utf-8')
          print(f'Created {output} with {post_count} posts and {len(refs)} images ({output.stat().st_size} bytes)')
          PY
      - name: Upload and verify archive via explicit FTPS
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/upload.log) 2>&1
          test -n "$FTP_PASSWORD"
          python - <<'PY'
          from pathlib import Path
          import os
          from automation.upload_city_batches_ftps import connect
          path = Path('/tmp') / os.environ['ARCHIVE_NAME']
          temporary = f'.{path.name}.uploading'
          ftp = connect()
          try:
              with path.open('rb') as stream: ftp.storbinary(f'STOR {temporary}', stream, blocksize=1024 * 1024)
              remote_size = ftp.size(temporary)
              if remote_size != path.stat().st_size:
                  try: ftp.delete(temporary)
                  finally: raise RuntimeError(f'Size verification failed: local={path.stat().st_size}, remote={remote_size}')
              try: ftp.delete(path.name)
              except Exception: pass
              ftp.rename(temporary, path.name)
              final_size = ftp.size(path.name)
              if final_size != path.stat().st_size: raise RuntimeError(f'Final size verification failed: local={path.stat().st_size}, remote={final_size}')
              print(f'Uploaded and verified: {path.name} ({final_size} bytes)')
          finally:
              try: ftp.quit()
              except Exception: ftp.close()
          PY
      - name: Record workflow outcome
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          archive = Path('/tmp') / os.environ['ARCHIVE_NAME']
          success = os.environ.get('BUILD_OUTCOME') == 'success' and os.environ.get('UPLOAD_OUTCOME') == 'success'
          upload_log = Path('/tmp/upload.log')
          error_tail = None if success or not upload_log.exists() else upload_log.read_text(encoding='utf-8', errors='replace')[-4000:]
          meta_path = Path('/tmp/archive-meta.json')
          meta = json.loads(meta_path.read_text(encoding='utf-8')) if meta_path.exists() else {}
          marker = Path('artifacts/city-content-queue/merged-images-ftps-upload.json')
          marker.write_text(json.dumps({
              'archive': archive.name,
              'post_count': meta.get('post_count'),
              'image_count': meta.get('image_count'),
              'size': meta.get('size'),
              'verified': success,
              'build_outcome': os.environ.get('BUILD_OUTCOME'),
              'upload_outcome': os.environ.get('UPLOAD_OUTCOME'),
              'error_tail': error_tail,
              'run_id': os.environ.get('RUN_ID'),
              'completed_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/city-content-queue/merged-images-ftps-upload.json
          git commit -m 'Record merged city image FTPS workflow outcome [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
