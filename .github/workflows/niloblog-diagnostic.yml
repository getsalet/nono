name: Niloblog native form diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/niloblog-diagnostic.yml]
permissions:
  contents: write
concurrency:
  group: niloblog-guarded-content
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NILOBLOG_USERNAME: ${{ secrets.NILOBLOG_USERNAME }}
      NILOBLOG_PASSWORD: ${{ secrets.NILOBLOG_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            automation
            data
            state
            artifacts/niloblog
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet playwright beautifulsoup4
      - run: python automation/niloblog_private_canary.py
      - name: Save sanitized report only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/niloblog/private-canary-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record read-only Niloblog form diagnostic [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

