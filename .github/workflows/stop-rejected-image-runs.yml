name: Stop user-rejected image production runs
on:
  push:
    branches: [main]
    paths: [.github/workflows/stop-rejected-image-runs.yml]
permissions:
  actions: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const allowed = new Set(['roya-backlink-queue.yml','roya-backlink-publish.yml','farsiblog-content.yml','rozblog-content.yml','blogfa-content.yml','loxblog-content.yml','blog-generated-image-acceptance.yml','rozblog-image-repair.yml']);
            const active = new Set(['in_progress','queued','pending','waiting','requested']);
            const {data} = await github.rest.actions.listWorkflowRunsForRepo({...context.repo, per_page:100});
            for (const run of data.workflow_runs) {
              const name = run.path.split('/').pop();
              if (run.id === context.runId || !allowed.has(name) || !active.has(run.status)) continue;
              try { await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id}); core.info('Stop requested: '+run.id+' '+name); }
              catch(e) { core.warning('Run may have completed before cancellation: '+run.id); }
            }
            core.summary.addHeading('User-rejected image method stopped').addRaw('Current/pending relevant runs received cancellation requests. New checkouts are gated by pause_image_production=true; no source-image fallback or image-repair writes.').write();
