name: Blogfa independent city content pipeline
on:
  workflow_dispatch:
    inputs:
      count: {description: 'New articles (0 = publish existing ready queue)', default: '3'}
      publish: {description: '1 = publish, 0 = generate/export only', default: '1'}
      dry_run: {description: '1 = configuration tests only, no publishable samples', default: '0'}
      target: {description: 'Optional topic key', default: ''}
      diagnose_login: {description: '1 = read-only native login diagnostic; no generation or publication', default: '0'}
  schedule:
    - cron: '8,23,38,53 * * * *'
  push:
    branches: [main]
    paths: [automation/check_blog_run_budget.py, tests/test_blog_budget_preflight_pipeline.py, tests/test_blog_generation_recovery.py, automation/farsiblog_backlink_queue.py, tests/test_blog_retry_pipeline.py, automation/blogfa_backlink_queue.py, automation/publish_blogfa_posts.py, automation/content_originality.py, tests/test_city_blog_pipeline.py, automation/city_backlink_policy.py, automation/blog_image_gate.py, data/blog-city-title-matrix.json, .github/workflows/blogfa-content.yml]
permissions:
  contents: write
concurrency:
  group: blogfa-content-pipeline
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  pipeline:
    needs: tests
    # Scheduled runs remain gated until a real hosted native publication is verified.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.BLOGFA_AUTOMATION_ENABLED == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
      AGNES_API_KEY16: ${{ secrets.AGNES_API_KEY16 }}
      AGNES_API_KEY17: ${{ secrets.AGNES_API_KEY17 }}
      AGNES_API_KEY18: ${{ secrets.AGNES_API_KEY18 }}
      AGNES_API_KEY19: ${{ secrets.AGNES_API_KEY19 }}
      AGNES_API_KEY20: ${{ secrets.AGNES_API_KEY20 }}
      AGNES_API_KEY21: ${{ secrets.AGNES_API_KEY21 }}
      AGNES_API_KEY22: ${{ secrets.AGNES_API_KEY22 }}
      AGNES_API_KEY23: ${{ secrets.AGNES_API_KEY23 }}
      AGNES_API_KEY24: ${{ secrets.AGNES_API_KEY24 }}
      AGNES_API_KEY25: ${{ secrets.AGNES_API_KEY25 }}
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      AGNES_MODEL: agnes-2.5-flash
      BLOGFA_BROWSER: chromium
      BLOGFA_USERNAME: ${{ secrets.BLOGFA_USERNAME }}
      BLOGFA_PASSWORD: ${{ secrets.BLOGFA_PASSWORD }}
      BLOGFA_COUNT: ${{ github.event.inputs.count || '3' }}
      BLOGFA_PUBLISH: ${{ github.event.inputs.publish || '1' }}
      BLOGFA_PUBLISH_LIMIT: '3'
      BLOGFA_DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
      BLOGFA_TARGET: ${{ github.event.inputs.target || '' }}
      BLOGFA_LOGIN_DIAGNOSTIC: ${{ github.event.inputs.diagnose_login || '0' }}
    steps:
      # Read-only native diagnosis does not use the 1GB cross-blog image archive.
      # Keep production checkout/history unchanged for checkpoint rebases.
      - name: Checkout read-only Blogfa diagnostic inputs
        if: env.BLOGFA_LOGIN_DIAGNOSTIC == '1'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /automation/
            /data/
            /state/blogfa-backlink-progress.json
            /artifacts/blogfa-backlink-queue/
      - uses: actions/checkout@v4
        if: env.BLOGFA_LOGIN_DIAGNOSTIC != '1'
        with: {fetch-depth: 0, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check rolling publication budget before costly steps
        id: budget
        run: python automation/check_blog_run_budget.py blogfa
      - name: Validate unattended credentials
        if: steps.budget.outputs.proceed == '1' && env.BLOGFA_PUBLISH == '1' && env.BLOGFA_DRY_RUN != '1'
        run: |
          if [ -z "$BLOGFA_USERNAME" ] || [ -z "$BLOGFA_PASSWORD" ]; then
            echo '::error::Set BLOGFA_USERNAME and BLOGFA_PASSWORD repository secrets.'
            exit 1
          fi
      - run: python -m pip install --quiet Pillow
        if: steps.budget.outputs.proceed == '1'
      - name: Generate independent city article with approved image
        if: steps.budget.outputs.proceed == '1' && env.BLOGFA_LOGIN_DIAGNOSTIC != '1'
        run: python automation/blogfa_backlink_queue.py
      - name: Install Playwright
        if: steps.budget.outputs.proceed == '1' && env.BLOGFA_PUBLISH == '1' && env.BLOGFA_DRY_RUN != '1'
        run: |
          bash automation/install_blog_browser.sh "$BLOGFA_BROWSER"
      - name: Publish and verify native Blogfa post
        if: steps.budget.outputs.proceed == '1' && env.BLOGFA_DRY_RUN != '1'
        run: |
          if [ "$BLOGFA_LOGIN_DIAGNOSTIC" = '1' ]; then
            python automation/blogfa_native.py
          else
            python automation/publish_blogfa_posts.py
          fi
      - name: Preserve blogfa recovery checkpoints
        if: always() && steps.budget.outputs.proceed == '1' && env.BLOGFA_DRY_RUN != '1' && env.BLOGFA_LOGIN_DIAGNOSTIC != '1'
        uses: actions/upload-artifact@v4
        with:
          name: blogfa-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/blogfa/backlink-queue.json
            state/blogfa-backlink-progress.json
            artifacts/blogfa-backlink-queue
            artifacts/content-originality
            artifacts/blog-image-reviews
      - name: Commit generation and per-post checkpoints
        if: always() && steps.budget.outputs.proceed == '1' && env.BLOGFA_DRY_RUN != '1' && env.BLOGFA_LOGIN_DIAGNOSTIC != '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/blogfa/backlink-queue.json
          for path in state/blogfa-backlink-progress.json artifacts/blogfa-backlink-queue artifacts/content-originality artifacts/blog-image-reviews; do
            if [ -e "$path" ]; then git add -f "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record original Blogfa content and verified publication'
          # Print paths only, never contents or secrets, if an unknown write appears.
          if ! git diff --quiet; then
            git diff --name-only
            echo '::error::Unexpected unstaged tracked changes; recovery artifact retained.'
            exit 1
          fi
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo '::error::Checkpoint push failed after three attempts; recovery artifact retained.'
          exit 1
