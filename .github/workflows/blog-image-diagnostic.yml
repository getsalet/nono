name: Blog image identity diagnostic (no publication)
on:
  workflow_dispatch:
    inputs:
      blog: {description: 'farsiblog or rozblog', default: 'farsiblog'}
      target: {description: 'Single existing topic key', required: true}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      AGNES_MODEL: agnes-2.5-flash
      BLOG_DIAGNOSTIC_BLOG: ${{ github.event.inputs.blog }}
      BLOG_DIAGNOSTIC_TARGET: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - name: Review one topic image without generation or publication
        run: python automation/blog_image_diagnostic.py
      - name: Preserve image diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-image-diagnostic-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            artifacts/blog-image-diagnostic
            artifacts/blog-image-reviews
