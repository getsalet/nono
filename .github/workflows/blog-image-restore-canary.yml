name: Generated article image restoration canary
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Validate seven dedicated blog image key pairs]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: blog-generated-image-restore-canary
  cancel-in-progress: false
jobs:
  canary:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_MODEL: agnes-2.5-flash
      AGNES_IMAGE_MODEL: agnes-image-2.5-flash
      AGNES_HEALTHY_SLOTS_ONLY: '1'
      AGNES_PREFERRED_KEY_SLOTS: AGNES_API_KEY14,AGNES_API_KEY15
      IMAGE_KEY_POOL_ENABLED: '1'
      BLOG_IMAGE_QUEUE_ENABLED: '1'
      BLOG_IMAGE_QUEUE_TOKEN: ${{ github.token }}
      PAIR_VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow beautifulsoup4 playwright
      - name: Regression tests before a single real article-image request
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate and review one article image without editing or publishing a post
        run: python automation/blog_image_restore_canary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-article-image-canary-${{ github.run_id }}
          path: artifacts/blog-image-restore-canary/
          if-no-files-found: ignore
