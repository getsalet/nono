name: Retire Blogfa automation without contacting Blogfa
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/retire-blogfa.yml]
permissions:
  contents: read
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const retired = new Set(['blogfa-content.yml', 'blogfa-login-diagnostic.yml']);
            const monitors = new Set(['blog-one-hour-monitor.yml', 'blog-four-health-monitor.yml']);
            const active = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {owner, repo, per_page:100});
            for (const w of workflows) {
              const file = w.path.split('/').pop();
              if (!retired.has(file) && !monitors.has(file)) continue;
              if (retired.has(file)) {
                await github.rest.actions.disableWorkflow({owner, repo, workflow_id:w.id});
                core.info('Disabled '+file);
              }
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {owner, repo, workflow_id:w.id, per_page:100});
              for (const run of runs) {
                if (!active.has(run.status)) continue;
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id:run.id});
                core.info('Cancelled '+file+' run '+run.id);
              }
            }
            await core.summary.addHeading('Blogfa retired').addRaw('Blogfa workflows disabled; active Blogfa and stale monitor runs cancelled. No Blogfa network request or login was performed. Historical records retained.').write();
