name: Blogsky observed public post reconciliation (no submit)
on:
  push:
    branches: [main]
    paths: [.github/workflows/blogsky-reconcile-public.yml]
permissions:
  contents: write
concurrency:
  group: blogsky-native-publication
  cancel-in-progress: false
jobs:
  verify-existing:
    if: contains(github.event.head_commit.message, '[blogsky-reconcile-public]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public DOM reader (no credentials)
        run: |
          python -m pip install --quiet Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Verify the already-observed Tehran article without login or submit
        run: python automation/reconcile_blogsky_public_post.py city-66afad426708678b https://afp-pipe.blogsky.com/1405/07/28/post-3/nvar-tip-tehran-yaddasht-ha-bahrebardari
      - name: Persist only publicly verified checkpoint
        run: python automation/checkpoint_blogsky_native.py --consume-recovery
