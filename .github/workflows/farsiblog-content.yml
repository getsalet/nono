name: FarsiBlog original content pipeline
on:
  workflow_dispatch:
    inputs:
      count: {description: 'New articles (0 = publish existing ready queue)', default: '3'}
      publish: {description: '1 = publish, 0 = generate/export only', default: '1'}
      dry_run: {description: '1 = configuration tests only, no publishable samples', default: '0'}
      target: {description: 'Optional topic key', default: ''}
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: [automation/check_blog_run_budget.py, tests/test_blog_budget_preflight_pipeline.py, tests/test_blog_generation_recovery.py, automation/farsiblog_backlink_queue.py, automation/publish_farsiblog_posts.py, automation/content_originality.py, tests/test_farsiblog_pipeline.py, automation/city_backlink_policy.py, automation/blog_image_gate.py, data/blog-city-title-matrix.json, .github/workflows/farsiblog-content.yml]
permissions:
  contents: write
concurrency:
  group: farsiblog-content-pipeline
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  pipeline:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.FARSIBLOG_AUTOMATION_ENABLED == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.AGNES_API_KEY }}
      IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'agnes-image-2.5-flash' }}
      IMAGE_REVIEW_MODEL: ${{ vars.AGNES_MODEL || 'agnes-3.0-flash' }}
      AGNES_HEALTHY_SLOTS_ONLY: '1'
      AGNES_PREFERRED_KEY_SLOTS: 'AGNES_API_KEY14,AGNES_API_KEY15'
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
      AGNES_API_KEY16: ${{ secrets.AGNES_API_KEY16 }}
      AGNES_API_KEY17: ${{ secrets.AGNES_API_KEY17 }}
      AGNES_API_KEY18: ${{ secrets.AGNES_API_KEY18 }}
      AGNES_API_KEY19: ${{ secrets.AGNES_API_KEY19 }}
      AGNES_API_KEY20: ${{ secrets.AGNES_API_KEY20 }}
      AGNES_API_KEY21: ${{ secrets.AGNES_API_KEY21 }}
      AGNES_API_KEY22: ${{ secrets.AGNES_API_KEY22 }}
      AGNES_API_KEY23: ${{ secrets.AGNES_API_KEY23 }}
      AGNES_API_KEY24: ${{ secrets.AGNES_API_KEY24 }}
      AGNES_API_KEY25: ${{ secrets.AGNES_API_KEY25 }}
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      AGNES_KEY_ROTATE_EVERY: '1'
      AGNES_MODEL: agnes-2.5-flash
      FARSIBLOG_USERNAME: ${{ secrets.FARSIBLOG_USERNAME }}
      FARSIBLOG_PASSWORD: ${{ secrets.FARSIBLOG_PASSWORD }}
      FARSIBLOG_COUNT: ${{ github.event.inputs.count || '3' }}
      FARSIBLOG_PUBLISH: ${{ github.event.inputs.publish || '1' }}
      FARSIBLOG_PUBLISH_LIMIT: '3'
      FARSIBLOG_DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
      FARSIBLOG_TARGET: ${{ github.event.inputs.target || '' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check rolling publication budget before costly steps
        id: budget
        run: python automation/check_blog_run_budget.py farsiblog
      - name: Validate unattended credentials
        if: steps.budget.outputs.proceed == '1' && env.FARSIBLOG_PUBLISH == '1' && env.FARSIBLOG_DRY_RUN != '1'
        run: |
          if [ -z "$FARSIBLOG_USERNAME" ] || [ -z "$FARSIBLOG_PASSWORD" ]; then
            echo '::error::Set FARSIBLOG_USERNAME and FARSIBLOG_PASSWORD repository secrets.'
            exit 1
          fi
      - run: python -m pip install --quiet Pillow
        if: steps.budget.outputs.proceed == '1'
      - name: Reconcile verified live editorial corrections
        if: steps.budget.outputs.proceed == '1'
        run: python automation/reconcile_farsiblog_editorials.py
      - name: Generate independent city article with approved image
        if: steps.budget.outputs.proceed == '1'
        run: python automation/farsiblog_backlink_queue.py
      - name: Install Playwright
        if: steps.budget.outputs.proceed == '1' && env.FARSIBLOG_PUBLISH == '1' && env.FARSIBLOG_DRY_RUN != '1'
        run: |
          bash automation/install_blog_browser.sh
      - name: Publish and verify native FarsiBlog post
        if: steps.budget.outputs.proceed == '1' && env.FARSIBLOG_DRY_RUN != '1'
        run: python automation/publish_farsiblog_posts.py
      - name: Preserve farsiblog recovery checkpoints
        if: always() && steps.budget.outputs.proceed == '1' && env.FARSIBLOG_DRY_RUN != '1'
        uses: actions/upload-artifact@v4
        with:
          name: farsiblog-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/farsiblog/backlink-queue.json
            state/farsiblog-backlink-progress.json
            artifacts/farsiblog-backlink-queue
            artifacts/content-originality
            artifacts/blog-image-reviews
      - name: Commit generation and per-post checkpoints
        if: always() && steps.budget.outputs.proceed == '1' && env.FARSIBLOG_DRY_RUN != '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/farsiblog/backlink-queue.json
          for path in state/farsiblog-backlink-progress.json artifacts/farsiblog-backlink-queue artifacts/content-originality artifacts/blog-image-reviews; do
            if [ -e "$path" ]; then git add -f "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record original FarsiBlog content and verified publication'
          # Print paths only, never contents or secrets, if an unknown write appears.
          if ! git diff --quiet; then
            git diff --name-only
            echo '::error::Unexpected unstaged tracked changes; recovery artifact retained.'
            exit 1
          fi
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo '::error::Checkpoint push failed after three attempts; recovery artifact retained.'
          exit 1
