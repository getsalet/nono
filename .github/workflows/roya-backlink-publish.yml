name: Publish Roya backlink posts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'how many ready posts to publish'
        required: false
        default: '3'
      publish:
        description: '1 = publish in the panel, 0 = export only'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: roya-backlink-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROYA_PUBLISH: ${{ github.event.inputs.publish || '0' }}
      ROYA_PUBLISH_LIMIT: ${{ github.event.inputs.limit || '3' }}
      ROYA_USERNAME: ${{ secrets.ROYA_USERNAME }}
      ROYA_PASSWORD: ${{ secrets.ROYA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Playwright
        if: ${{ github.event.inputs.publish == '1' }}
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Export or publish ready posts
        run: python automation/publish_roya_posts.py
      - name: Commit publish state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/roya/backlink-queue.json artifacts/roya-backlink-queue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Roya publish queue"
          git pull --rebase origin main
          git push origin main
