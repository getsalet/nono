name: Publish Roya backlink posts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum ready posts this run'
        required: false
        default: '30'
      publish:
        description: '1 = publish, 0 = explicitly export only'
        required: false
        default: '1'
  workflow_run:
    workflows: ['Roya blog city backlink queue']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/roya-backlink-publish.yml
      - automation/publish_roya_posts.py

permissions:
  contents: write

concurrency:
  group: roya-backlink-pipeline
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_HEALTHY_SLOTS_ONLY: '1'
      AGNES_PREFERRED_KEY_SLOTS: 'AGNES_API_KEY14,AGNES_API_KEY15'
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
      AGNES_API_KEY16: ${{ secrets.AGNES_API_KEY16 }}
      AGNES_API_KEY17: ${{ secrets.AGNES_API_KEY17 }}
      AGNES_API_KEY18: ${{ secrets.AGNES_API_KEY18 }}
      AGNES_API_KEY19: ${{ secrets.AGNES_API_KEY19 }}
      AGNES_API_KEY20: ${{ secrets.AGNES_API_KEY20 }}
      AGNES_API_KEY21: ${{ secrets.AGNES_API_KEY21 }}
      AGNES_API_KEY22: ${{ secrets.AGNES_API_KEY22 }}
      AGNES_API_KEY23: ${{ secrets.AGNES_API_KEY23 }}
      AGNES_API_KEY24: ${{ secrets.AGNES_API_KEY24 }}
      AGNES_API_KEY25: ${{ secrets.AGNES_API_KEY25 }}
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      AGNES_KEY_ROTATE_EVERY: '1'
      AGNES_MODEL: agnes-2.5-flash
      ROYA_PUBLISH: ${{ github.event.inputs.publish || '1' }}
      ROYA_PUBLISH_LIMIT: ${{ github.event.inputs.limit || '30' }}
      ROYA_DELAY_SECONDS: '10'
      ROYA_VERIFY_LOGIN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      ROYA_USERNAME: ${{ secrets.ROYA_USERNAME }}
      ROYA_PASSWORD: ${{ secrets.ROYA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        # Queued workflow events may carry an old SHA; read main only after acquiring the shared lock.
        with: {fetch-depth: 0, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Respect user stop before costly or mutable work
        id: control
        run: python automation/check_blog_pipeline_control.py roya
      - run: python -m pip install --quiet Pillow
        if: steps.control.outputs.proceed == '1'
      - name: Validate unattended login credentials
        if: steps.control.outputs.proceed == '1' && (env.ROYA_PUBLISH == '1')
        run: |
          if [ -z "$ROYA_USERNAME" ] || [ -z "$ROYA_PASSWORD" ]; then
            echo '::error::Set ROYA_USERNAME and ROYA_PASSWORD repository secrets for unattended Roya publication.'
            exit 1
          fi
      - name: Install Playwright
        if: steps.control.outputs.proceed == '1' && (env.ROYA_PUBLISH == '1')
        run: |
          bash automation/install_blog_browser.sh
      - name: Publish and verify ready posts
        if: steps.control.outputs.proceed == '1'
        run: python automation/publish_roya_posts.py
      - name: Commit per-post publication checkpoints
        if: steps.control.outputs.proceed == '1' && (always())
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/roya/backlink-queue.json state/roya-backlink-progress.json artifacts/roya-backlink-queue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record verified Roya publication checkpoints"
          git pull --rebase origin main
          git push origin main
