# Restarted after migration to smxsmx20/nono.
name: Purge GitHub Actions artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/purge-actions-artifacts.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: navar-actions-artifact-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete stored Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "navar-artifact-cleanup",
          }

          def call(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          deleted = 0
          failed = 0
          bytes_deleted = 0
          while True:
              status, body = call(f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100")
              if status != 200:
                  print(
                      "::warning::Artifact cleanup could not list artifacts: "
                      f"{status} {body.decode('utf-8', 'replace')}"
                  )
                  break
              artifacts = json.loads(body).get("artifacts") or []
              if not artifacts:
                  break
              deleted_this_pass = 0
              for artifact in artifacts:
                  artifact_id = artifact["id"]
                  del_status, del_body = call(
                      f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}",
                      method="DELETE",
                  )
                  if del_status in (204, 200, 404):
                      deleted += 1
                      deleted_this_pass += 1
                      bytes_deleted += int(artifact.get("size_in_bytes") or 0)
                      print(
                          f"deleted {artifact.get('name')} id={artifact_id} "
                          f"size={artifact.get('size_in_bytes')}"
                      )
                  else:
                      failed += 1
                      print(
                          "::warning::Failed to delete "
                          f"{artifact.get('name')} id={artifact_id} status={del_status} "
                          f"{del_body.decode('utf-8', 'replace')}"
                      )
              # Avoid retrying the same undeletable page forever. Artifact
              # cleanup is maintenance and must never block production queues.
              if deleted_this_pass == 0:
                  break
          print(
              f"artifact_cleanup deleted={deleted} failed={failed} "
              f"bytes_deleted={bytes_deleted}"
          )
          PY