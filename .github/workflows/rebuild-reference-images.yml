name: Rebuild exact product reference images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-reference-images.yml'
      - 'automation/rebuild_city_images_preserve_posts.py'
      - 'automation/image_prompt_policy.py'
      - 'automation/assets/**'
permissions:
  contents: write
concurrency:
  group: navar-city-content-queue
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.AGNES_API_KEY }}
      IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
      AGNES_IMAGE_MODEL: agnes-image-2.5-flash
      IMAGE_WORKERS: "8"
      REBUILD_FROM_POST: "250"
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Verify reference rebuild inputs
        run: |
          test -n "$AGNES_API_KEY"
          python -m py_compile automation/rebuild_city_images_preserve_posts.py automation/image_prompt_policy.py automation/city_content_queue.py automation/city_content_queue_cloudflare.py
      - name: Rebuild existing scenes with exact product assets
        run: python automation/rebuild_city_images_preserve_posts.py | tee reference-image-rebuild.log
      - name: Refresh packages and status
        run: |
          python automation/package_city_content_batches.py
          python automation/render_city_queue_status.py
      - name: Commit rebuilt images and metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A artifacts/city-content-queue
          git add -f artifacts/city-content-queue/packages/batch-*.zip 2>/dev/null || true
          git add -f artifacts/city-content-queue/image-rebuild-reference-rerender-3d-v3.json reference-image-rebuild.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild city images with 3D AFP reference rerendering"
          git pull --rebase origin main
          git push origin main
