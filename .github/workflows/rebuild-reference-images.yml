# Restarted after migration to smxsmx20/nono.
name: Rebuild exact product reference images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-reference-images.yml'
      - 'automation/rebuild_city_images_preserve_posts.py'
      - 'automation/image_prompt_policy.py'
      - 'automation/image_quality_gate.py'
      - 'tests/test_city_image_policy.py'
      - 'automation/assets/**'
permissions:
  contents: write
  actions: write
concurrency:
  # Rebuilds have a separate lane so queue self-chaining cannot replace the pending rebuild.
  # Rebuild stays isolated; production queues receive priority within the shared 14-key pool.
  group: navar-city-image-rebuild
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.AGNES_API_KEY }}
      IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
      AGNES_IMAGE_MODEL: agnes-image-2.5-flash
      IMAGE_WORKERS: "8"
      IMAGE_RETRIES: "6"
      IMAGE_QA_ATTEMPTS: "10"
      IMAGE_SET_QA_ATTEMPTS: "3"
      REBUILD_FROM_POST: "1"
      REBUILD_POST_LIMIT: "2"
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Verify reference rebuild inputs
        run: |
          test -n "$AGNES_API_KEY"
          python -m py_compile automation/rebuild_city_images_preserve_posts.py automation/image_prompt_policy.py automation/image_quality_gate.py automation/city_content_queue.py automation/city_content_queue_cloudflare.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Rebuild existing scenes with exact product assets
        id: rebuild
        shell: bash
        run: |
          set +e
          python automation/rebuild_city_images_preserve_posts.py 2>&1 | tee reference-image-rebuild.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Refresh packages and status
        run: |
          python automation/package_city_content_batches.py
          python automation/render_city_queue_status.py
      - name: Commit rebuilt images and metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A artifacts/city-content-queue
          git add -f artifacts/city-content-queue/packages/batch-*.zip 2>/dev/null || true
          git add -f artifacts/city-content-queue/image-rebuild-article-parity-v14-three-image.json reference-image-rebuild.log
          if git diff --cached --quiet; then exit 0; fi
          state_dir="$(mktemp -d)"
          git diff --cached --name-only -z --diff-filter=ACMRT > "$state_dir/files"
          git diff --cached --name-only -z --diff-filter=D > "$state_dir/deleted"
          if [ -s "$state_dir/files" ]; then tar --null -T "$state_dir/files" -cf "$state_dir/payload.tar"; fi
          git fetch origin main
          git reset --hard origin/main
          if [ -f "$state_dir/payload.tar" ]; then tar -xf "$state_dir/payload.tar"; fi
          if [ -s "$state_dir/deleted" ]; then xargs -0 -r rm -f -- < "$state_dir/deleted"; fi
          git add -A artifacts/city-content-queue
          git add -f artifacts/city-content-queue/packages/batch-*.zip 2>/dev/null || true
          git add -f artifacts/city-content-queue/image-rebuild-article-parity-v14-three-image.json reference-image-rebuild.log
          git commit -m "Rebuild city images with approved topic-first AFP policy"
          git push origin main
      - name: Fail after preserving rebuild diagnostics
        if: steps.rebuild.outputs.exit_code != '0'
        run: echo "::warning::One reference set was quarantined after diagnostics were preserved; the city generator remains available."
      - name: Continue image rebuild automatically
        if: always() && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining="$(python - <<'PY'
          import json
          from pathlib import Path
          path=Path('artifacts/city-content-queue/image-rebuild-article-parity-v14-three-image.json')
          print(int(json.loads(path.read_text(encoding='utf-8')).get('remaining_candidates',0)) if path.exists() else 0)
          PY
          )"
          if [ "$remaining" -gt 0 ]; then
            echo "Image rebuild has $remaining remaining posts; dispatching the next isolated batch."
            sleep 30
            gh workflow run rebuild-reference-images.yml --ref main
          else
            echo "Image rebuild is complete."
          fi
