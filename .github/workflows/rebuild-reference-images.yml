# Restarted after migration to smxsmx20/nono.
name: Rebuild exact product reference images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/rebuild_city_images_preserve_posts.py'
      - 'automation/audit_recent_city_images.py'
      - 'automation/image_prompt_policy.py'
      - 'automation/image_quality_gate.py'
      - 'tests/test_city_image_policy.py'
      - 'automation/assets/**'
      - 'artifacts/city-content-queue/REBUILD_PAUSED'
permissions:
  contents: write
  actions: write
concurrency:
  # Rebuilds have a separate lane so queue self-chaining cannot replace the pending rebuild.
  # Rebuild stays isolated; production queues receive priority within the shared 14-key pool.
  group: navar-city-content-pipeline
  # A push means an operational upgrade was merged: cancel the old run so no
  # remaining post is rebuilt with pre-upgrade code. Normal self-dispatched
  # workflow runs stay serialized and never cancel each other.
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY15 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY16 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY17 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY18 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY19 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY20 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY21 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY22 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY23 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY24 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY25 }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.AGNES_API_KEY14 }}
      IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
      AGNES_IMAGE_MODEL: agnes-image-2.5-flash
      IMAGE_WORKERS: "3"
      REBUILD_POST_WORKERS: "2"
      REBUILD_POST_STAGGER_SECONDS: "3"
      IMAGE_RETRIES: "6"
      IMAGE_QA_ATTEMPTS: "10"
      IMAGE_SET_QA_ATTEMPTS: "3"
      REBUILD_FROM_POST: "1"
      # Amortize checkout, packaging and commit overhead without increasing the
      # two-post / six-image concurrency cap.
      REBUILD_POST_LIMIT: "12"
      REBUILD_COMPLETED_SINCE: "2026-09-27T17:48:15+00:00"
      RECENT_IMAGE_AUDIT_SINCE: "2026-09-27T17:48:15+00:00"
      RECENT_IMAGE_AUDIT_LIMIT: "48"
      RECENT_IMAGE_AUDIT_WORKERS: "4"
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Check emergency rebuild pause
        id: pause
        run: |
          if [ -f artifacts/city-content-queue/REBUILD_PAUSED ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "Reference-image rebuild is paused for policy redesign."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.pause.outputs.paused != 'true'
        with: {python-version: "3.12"}
      - if: steps.pause.outputs.paused != 'true'
        run: python -m pip install --disable-pip-version-check pillow
      - name: Verify reference rebuild inputs
        if: steps.pause.outputs.paused != 'true'
        id: verify
        run: |
          test -n "$AGNES_API_KEY"
          python -m py_compile automation/audit_recent_city_images.py automation/rebuild_city_images_preserve_posts.py automation/image_prompt_policy.py automation/image_quality_gate.py automation/city_content_queue.py automation/city_content_queue_cloudflare.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Audit current recent images against approved references
        if: steps.pause.outputs.paused != 'true'
        id: audit
        run: python automation/audit_recent_city_images.py
      - name: Rebuild existing scenes with exact product assets
        if: steps.pause.outputs.paused != 'true'
        id: rebuild
        shell: bash
        run: |
          set +e
          python automation/rebuild_city_images_preserve_posts.py 2>&1 | tee reference-image-rebuild.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Refresh packages and status
        if: steps.pause.outputs.paused != 'true'
        run: |
          remaining="$(python - <<'PY'
          import json
          from pathlib import Path
          audit_path=Path('artifacts/city-content-queue/recent-image-audit-v1.json')
          rebuild_path=Path('artifacts/city-content-queue/recent-image-rebuild-v3.json')
          audit=json.loads(audit_path.read_text(encoding='utf-8')) if audit_path.exists() else {}
          rebuild=json.loads(rebuild_path.read_text(encoding='utf-8')) if rebuild_path.exists() else {}
          print(int(audit.get('remaining_candidates',0))+int(rebuild.get('remaining_candidates',0)))
          PY
          )"
          if [ "$remaining" -eq 0 ]; then
            echo "Approved integrated restoration is complete; resuming production after final packaging."
            rm -f artifacts/city-content-queue/QUEUE_PAUSED
            python automation/package_city_content_batches.py
          else
            echo "Strict restoration has $remaining posts remaining; deferring expensive ZIP repackaging until completion."
          fi
          python automation/render_city_queue_status.py
      - name: Commit rebuilt images and metadata
        if: steps.pause.outputs.paused != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A artifacts/city-content-queue
          git add -f artifacts/city-content-queue/packages/batch-*.zip 2>/dev/null || true
          git add -f artifacts/city-content-queue/recent-image-audit-v1.json artifacts/city-content-queue/recent-image-rebuild-v3.json reference-image-rebuild.log
          if git diff --cached --quiet; then exit 0; fi
          state_dir="$(mktemp -d)"
          git diff --cached --name-only -z --diff-filter=ACMRT > "$state_dir/files"
          git diff --cached --name-only -z --diff-filter=D > "$state_dir/deleted"
          if [ -s "$state_dir/files" ]; then tar --null -T "$state_dir/files" -cf "$state_dir/payload.tar"; fi
          git fetch origin main
          git reset --hard origin/main
          if [ -f "$state_dir/payload.tar" ]; then tar -xf "$state_dir/payload.tar"; fi
          if [ -s "$state_dir/deleted" ]; then xargs -0 -r rm -f -- < "$state_dir/deleted"; fi
          git add -A artifacts/city-content-queue
          git add -f artifacts/city-content-queue/packages/batch-*.zip 2>/dev/null || true
          git add -f artifacts/city-content-queue/recent-image-audit-v1.json artifacts/city-content-queue/recent-image-rebuild-v3.json reference-image-rebuild.log
          git commit -m "Rebuild city images with approved single-pass integrated policy"
          git push origin main
      - name: Fail after preserving rebuild diagnostics
        if: steps.pause.outputs.paused != 'true' && steps.rebuild.outputs.exit_code != '0'
        run: echo "::warning::One reference set was quarantined after diagnostics were preserved; the city generator remains available."
      - name: Continue image rebuild automatically
        # Never self-dispatch after a syntax/test/input failure; otherwise a bad
        # validation commit creates an endless chain of failed workflow runs.
        if: always() && !cancelled() && steps.pause.outputs.paused != 'true' && steps.verify.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r remaining stalled <<<"$(python - <<'PY'
          import json
          from pathlib import Path
          audit_path=Path('artifacts/city-content-queue/recent-image-audit-v1.json')
          rebuild_path=Path('artifacts/city-content-queue/recent-image-rebuild-v3.json')
          audit=json.loads(audit_path.read_text(encoding='utf-8')) if audit_path.exists() else {}
          rebuild=json.loads(rebuild_path.read_text(encoding='utf-8')) if rebuild_path.exists() else {}
          print(int(audit.get('remaining_candidates',0))+int(rebuild.get('remaining_candidates',0)), int(rebuild.get('consecutive_no_progress_runs',0)))
          PY
          )"
          if [ "$remaining" -gt 0 ]; then
            cooldown=15
            if [ "$stalled" -ge 2 ]; then cooldown=120; fi
            echo "Strict restoration has $remaining remaining posts; stalled_runs=$stalled cooldown=${cooldown}s before the next checkpoint-aware batch."
            sleep "$cooldown"
            gh workflow run rebuild-reference-images.yml --ref main
          else
            echo "Image rebuild is complete; resuming the city production queue."
            gh workflow run city-content-queue.yml --ref main
          fi
