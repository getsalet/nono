name: Roya blog city backlink queue

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'how many posts this run'
        required: false
        default: '3'
      dry_run:
        description: '1 = offline sample, no Agnes call'
        required: false
        default: '0'
      target:
        description: 'single queue key to process (optional)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - automation/check_blog_ready_image_handoff.py
      - tests/test_blog_ready_image_handoff.py
      - automation/build_roya_queue.py
      - automation/roya_backlink_queue.py
      - tests/test_roya_capacity_recovery.py
      - tests/test_roya_queue_runtime.py
      - tests/test_roya_domain_repair.py
      - .github/workflows/roya-backlink-queue.yml
  workflow_run:
    workflows: ['Independent AFP article image stock (no publication)']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: roya-backlink-pipeline
  cancel-in-progress: false

jobs:
  image_handoff:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.ready.outputs.proceed }}
      cached_only: ${{ steps.ready.outputs.cached_only }}
      target: ${{ steps.ready.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: ready
        run: python automation/check_blog_ready_image_handoff.py roya
  queue:
    needs: image_handoff
    if: needs.image_handoff.outputs.proceed == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      IMAGE_API_KEY: ${{ secrets.AGNES_API_KEY10 }}
      IMAGE_KEY_SLOT: AGNES_API_KEY10
      IMAGE_KEY_POOL_ENABLED: '1'
      IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'agnes-image-2.5-flash' }}
      AGNES_IMAGE_TRANSIENT_FAILOVER: '0'
      IMAGE_REVIEW_MODEL: ${{ vars.AGNES_MODEL || 'agnes-3.0-flash' }}
      AGNES_HEALTHY_SLOTS_ONLY: '1'
      AGNES_PREFERRED_KEY_SLOTS: 'AGNES_API_KEY14,AGNES_API_KEY15'
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
      AGNES_API_KEY16: ${{ secrets.AGNES_API_KEY16 }}
      AGNES_API_KEY17: ${{ secrets.AGNES_API_KEY17 }}
      AGNES_API_KEY18: ${{ secrets.AGNES_API_KEY18 }}
      AGNES_API_KEY19: ${{ secrets.AGNES_API_KEY19 }}
      AGNES_API_KEY20: ${{ secrets.AGNES_API_KEY20 }}
      AGNES_API_KEY21: ${{ secrets.AGNES_API_KEY21 }}
      AGNES_API_KEY22: ${{ secrets.AGNES_API_KEY22 }}
      AGNES_API_KEY23: ${{ secrets.AGNES_API_KEY23 }}
      AGNES_API_KEY24: ${{ secrets.AGNES_API_KEY24 }}
      AGNES_API_KEY25: ${{ secrets.AGNES_API_KEY25 }}
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      AGNES_KEY_ROTATE_EVERY: '1'
      AGNES_MODEL: agnes-2.5-flash
      BLOG_READY_IMAGE_HANDOFF: ${{ needs.image_handoff.outputs.cached_only }}
      ROYA_COUNT: ${{ needs.image_handoff.outputs.cached_only == '1' && '1' || github.event.inputs.count || '3' }}
      ROYA_DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
      ROYA_TARGET: ${{ needs.image_handoff.outputs.target || github.event.inputs.target || '' }}
      ROYA_MIN_WORDS: '500'
      ROYA_MAX_WORDS: '1000'
      ROYA_MIN_LINKS: '2'
      ROYA_MAX_LINKS: '2'
      ROYA_BLOG_URL: https://afp.royablog.ir
    steps:
      - uses: actions/checkout@v4
        # Queued workflow events may carry an old SHA; read main only after acquiring the shared lock.
        with: {fetch-depth: 0, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Respect user stop before costly or mutable work
        id: control
        run: python automation/check_blog_pipeline_control.py roya
      - run: python -m pip install --quiet Pillow
        if: steps.control.outputs.proceed == '1'
      - name: Verify bounded capacity recovery before generation
        if: steps.control.outputs.proceed == '1'
        run: |
          python -m unittest discover -s tests -p 'test_roya_capacity_recovery.py' -v
          python -m unittest discover -s tests -p 'test_roya_queue_runtime.py' -v
          python -m unittest discover -s tests -p 'test_roya_domain_repair.py' -v
      - name: Build or refresh the city queue
        if: steps.control.outputs.proceed == '1'
        run: python automation/build_roya_queue.py
      - name: Generate city backlink posts
        if: steps.control.outputs.proceed == '1'
        env:
          BLOG_IMAGE_QUEUE_ENABLED: '1'
          BLOG_IMAGE_QUEUE_TOKEN: ${{ github.token }}
        run: python automation/roya_backlink_queue.py
      - name: Preserve Roya generation recovery checkpoint
        if: steps.control.outputs.proceed == '1' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: roya-generation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/roya/backlink-queue.json
            state/roya-backlink-progress.json
            artifacts/roya-backlink-queue
            artifacts/content-originality
            artifacts/blog-image-reviews
      - name: Commit queue, state and artifacts
        if: steps.control.outputs.proceed == '1' && (always())
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/roya/backlink-queue.json state/roya-backlink-progress.json artifacts/roya-backlink-queue
          if [ -d artifacts/blog-image-reviews ]; then git add -f artifacts/blog-image-reviews; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Roya city backlink queue"
          for attempt in 1 2 3; do
            git pull --rebase origin main || { echo '::error::Checkpoint conflict; recovery artifact retained, no overwrite.'; exit 1; }
            if git push origin main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo '::error::Checkpoint push failed; recovery artifact retained.'
          exit 1
