name: Bounded multi-stage image calibration (no blog publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [automation/calibrate_blog_images.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: blog-image-calibration
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      IMAGE_MODEL: agnes-image-2.5-flash
      IMAGE_REVIEW_MODEL: agnes-3.0-flash
      AGNES_MODEL: agnes-3.0-flash
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
      AGNES_API_KEY16: ${{ secrets.AGNES_API_KEY16 }}
      AGNES_API_KEY17: ${{ secrets.AGNES_API_KEY17 }}
      AGNES_PREFERRED_KEY_SLOTS: AGNES_API_KEY14,AGNES_API_KEY15
      AGNES_HEALTHY_SLOTS_ONLY: '1'
      BLOG_IMAGE_QUEUE_ENABLED: '1'
      BLOG_IMAGE_QUEUE_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow beautifulsoup4
      - name: Offline calibration contract tests
        run: python -m unittest discover -s tests -p test_blog_image_calibration.py -v
      - name: Baseline, candidate comparison and unseen-topic repeat
        run: python automation/calibrate_blog_images.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-calibration-${{ github.run_id }}
          path: artifacts/blog-image-calibration/
          retention-days: 14
          if-no-files-found: ignore
