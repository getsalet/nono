name: Safe health audit of 25 existing Agnes secret slots
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agnes-key-health
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'getsalet/nono'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
      AGNES_API_KEY16: ${{ secrets.AGNES_API_KEY16 }}
      AGNES_API_KEY17: ${{ secrets.AGNES_API_KEY17 }}
      AGNES_API_KEY18: ${{ secrets.AGNES_API_KEY18 }}
      AGNES_API_KEY19: ${{ secrets.AGNES_API_KEY19 }}
      AGNES_API_KEY20: ${{ secrets.AGNES_API_KEY20 }}
      AGNES_API_KEY21: ${{ secrets.AGNES_API_KEY21 }}
      AGNES_API_KEY22: ${{ secrets.AGNES_API_KEY22 }}
      AGNES_API_KEY23: ${{ secrets.AGNES_API_KEY23 }}
      AGNES_API_KEY24: ${{ secrets.AGNES_API_KEY24 }}
      AGNES_API_KEY25: ${{ secrets.AGNES_API_KEY25 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /automation/audit_agnes_keys.py
            /tests/test_audit_agnes_keys.py
            /data/agnes-key-health/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate redaction and slot inventory without credentials
        run: python -m unittest discover -s tests -p test_audit_agnes_keys.py -v
      - name: Probe each unique credential with a tiny text request
        run: python automation/audit_agnes_keys.py
      - name: Persist sanitized result only
        if: always()
        run: |
          path=data/agnes-key-health/latest.json
          if [ ! -f "$path" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f "$path"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record per-secret Agnes health without credential values'
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
