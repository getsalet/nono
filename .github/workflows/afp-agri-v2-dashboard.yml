name: AFP agriculture - deploy progress dashboard
on:
  push:
    branches: [main]
    paths:
      - docs/agri-v2-dashboard/**
      - docs/status/**
      - .github/workflows/afp-agri-v2-dashboard.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: afp-agri-v2-dashboard
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/agri-v2-dashboard
            docs/status
            tests
            .github/workflows
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test status panel data contracts
        run: node --test tests/status_data.test.cjs tests/status_repair.test.cjs tests/status_priorities.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare combined Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/status
          cp -R docs/agri-v2-dashboard/. _site/
          cp -R docs/status/. _site/status/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy status dashboards
        id: deployment
        uses: actions/deploy-pages@v4
