name: Niloblog guarded original articles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/niloblog-content.yml, data/niloblog/runtime-control.json]
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: niloblog-guarded-content
  # Only an explicitly tagged runtime repair cancels a blocked initialization.
  # Durable external-write intents prevent blind retry after cancellation.
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[niloblog-runtime-repair]') }}
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NILOBLOG_USERNAME: ${{ secrets.NILOBLOG_USERNAME }}
      NILOBLOG_PASSWORD: ${{ secrets.NILOBLOG_PASSWORD }}
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_MODEL: agnes-2.5-flash
      AGNES_JSON_ATTEMPTS: '2'
      AGNES_REQUEST_TIMEOUT: '90'
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_IMAGE_MODEL: agnes-image-2.5-flash
      BLOG_IMAGE_QUEUE_ENABLED: '1'
      BLOG_IMAGE_QUEUE_TOKEN: ${{ github.token }}
      IMAGE_KEY_POOL_ENABLED: '1'
      AGNES_HEALTHY_SLOTS_ONLY: '1'
      AGNES_PREFERRED_KEY_SLOTS: AGNES_API_KEY14,AGNES_API_KEY15
      AGNES_KEY_ROTATE_EVERY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            automation
            data
            state
            tests
            templates/niloblog
            .github/workflows
            artifacts/niloblog
            artifacts/content-originality
            artifacts/roya-backlink-queue/items
            artifacts/farsiblog-backlink-queue/items
            artifacts/rozblog-backlink-queue/items
            artifacts/loxblog-backlink-queue/items
            artifacts/blogsky-backlink-queue/items
            artifacts/blogfa-backlink-queue/items
            artifacts/parsiblog-backlink-queue/items
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Respect global stop before dependencies or API work
        id: gate
        run: |
          python - <<'PY'
          import json,os,sys
          sys.path.insert(0,'automation')
          from check_blog_pipeline_control import decision
          c=json.load(open('data/niloblog/runtime-control.json'))
          ok=decision('roya')['proceed'] and c.get('enabled') is True
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('proceed='+('1' if ok else '0')+'\n')
          print('Niloblog preflight allowed' if ok else 'Niloblog intentionally stopped')
          PY
      - name: Validate credential presence without exposing values
        if: steps.gate.outputs.proceed == '1'
        run: |
          if [ -z "$NILOBLOG_USERNAME" ] || [ -z "$NILOBLOG_PASSWORD" ]; then
            echo '::error::Set NILOBLOG_USERNAME and NILOBLOG_PASSWORD repository secrets.'
            exit 1
          fi
      - name: Install runtime dependencies
        if: steps.gate.outputs.proceed == '1'
        run: python -m pip install --quiet beautifulsoup4 Pillow playwright
      - name: Run Niloblog regression tests
        if: steps.gate.outputs.proceed == '1'
        run: python -m unittest discover -s tests -p 'test_niloblog*.py'
      - name: Install native browser
        if: steps.gate.outputs.proceed == '1'
        run: |
          # ubuntu-latest already provides Google Chrome and its dependencies.
          # Avoid the shared apt/CDN installation bottleneck; fail closed if absent.
          command -v google-chrome
          google-chrome --version
      - name: Run one bounded guarded cycle
        if: steps.gate.outputs.proceed == '1'
        run: python automation/niloblog_pipeline.py
      - name: Retain non-secret recovery receipts
        if: always() && steps.gate.outputs.proceed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: niloblog-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/niloblog/runtime-state.json
            artifacts/niloblog
