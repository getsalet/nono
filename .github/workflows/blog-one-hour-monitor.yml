name: One-hour tape-only five-blog recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [automation/start-blog-one-hour-monitor.txt]
permissions:
  contents: write
  actions: write
concurrency:
  group: blog-one-hour-monitor
  cancel-in-progress: false
jobs:
  observe-one-hour:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.AGNES_API_KEY }}
      IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'agnes-image-2.5-flash' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow
      - name: Offline regression tests before any image request
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Observe 3600 seconds and activate guarded tape pipelines
        run: python automation/monitor_blog_generators_one_hour.py
