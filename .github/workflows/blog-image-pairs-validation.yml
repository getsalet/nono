name: Validate seven dedicated blog image key pairs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/blog-image-pair-validation-request.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: afp-usable-key-audit
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet Pillow beautifulsoup4
      - name: Offline regression checks before billable requests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: One real image request per assigned unique slot; no publication
        env:
          AGNES_API_BASE: https://apihub.agnes-ai.com/v1
          AGNES_MODEL: agnes-2.5-flash
          AGNES_IMAGE_MODEL: agnes-image-2.5-flash
          AGNES_HEALTHY_SLOTS_ONLY: '0'
          BLOG_IMAGE_QUEUE_ENABLED: '1'
          BLOG_IMAGE_QUEUE_TOKEN: ${{ github.token }}
          AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
          AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
          AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
          AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
          AGNES_API_KEY16: ${{ secrets.AGNES_API_KEY16 }}
          AGNES_API_KEY17: ${{ secrets.AGNES_API_KEY17 }}
          AGNES_API_KEY18: ${{ secrets.AGNES_API_KEY18 }}
          AGNES_API_KEY19: ${{ secrets.AGNES_API_KEY19 }}
          AGNES_API_KEY20: ${{ secrets.AGNES_API_KEY20 }}
          AGNES_API_KEY21: ${{ secrets.AGNES_API_KEY21 }}
          AGNES_API_KEY22: ${{ secrets.AGNES_API_KEY22 }}
          AGNES_API_KEY23: ${{ secrets.AGNES_API_KEY23 }}
          AGNES_API_KEY24: ${{ secrets.AGNES_API_KEY24 }}
          AGNES_API_KEY25: ${{ secrets.AGNES_API_KEY25 }}
          AGNES_API_KEY26: ${{ secrets.AGNES_API_KEY26 }}
          AGNES_API_KEY27: ${{ secrets.AGNES_API_KEY27 }}
        run: python automation/validate_blog_image_pairs.py
      - name: Keep sanitized pair-validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-image-pairs-${{ github.run_id }}
          path: data/blog-image-pair-validation/
          if-no-files-found: ignore
